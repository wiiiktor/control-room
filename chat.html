<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Control</title>
<!--
  Single-screen cartoon control panel. Every assistant reply REPLACES the screen.
  CTRL markup, one directive per line:

    ::ask   <text>              huge headline question
    ::say   <text>              lead statement
    ::note  <text>              small secondary detail
    ::kv    <key> = <value>     yellow stat tile (they tile into a grid)
    ::ok|::warn|::err <text>    status badge
    ::wait  <text>              pending badge
    ::pick  <label>             big green choice button — click sends <label>
    ::pick  <label> => <cmd>    button showing <label>, sending <cmd>
    ::fill  <text>              button that pre-fills the composer instead of sending
    ::chart <title> = v1,v2,..  small line chart, scaled to its own min/max
    ::html  <fragment>          raw HTML; ::html .. ::endhtml for several lines
    ::card  <title>             clickable tile; lines until ::endcard open in the right pane
    ::endcard                   closes the most recent ::card

  The yellow C picks the palette: light (default), dark, or "peas with corn".
  Press 1-9 to choose while the composer is empty. The yellow T opens the timeline:
  every past reply, re-rendered small; hover one to read it full size on the left.
-->
<script>
  // Before the first paint, so the page never flashes the wrong palette.
  try { document.documentElement.dataset.theme = localStorage.getItem('ctrl-theme') || 'light'; }
  catch { document.documentElement.dataset.theme = 'light'; }
</script>
<style>
  /* ---- PALETTES -------------------------------------------------------------
     Three, chosen with the yellow C. :root holds dark; light is the DEFAULT and is
     stamped on <html> before the first paint. Dark and light take
     their surfaces, borders and accents from VS Code's own default themes (Dark
     Modern / Light Modern) -- editor background, widget surface, foreground, the
     #2b2b2b / #e5e5e5 border, the primary-button blue, and the chart green, yellow
     and red. The shapes stay ours: this panel is drawn in thick ink outlines, which
     no editor theme does. --on-green / --on-yellow / --on-red carry the text that
     sits ON each filled accent, because white reads on the blue and black on the
     gold. ------------------------------------------------------------------------ */
  :root, :root[data-theme="dark"] {
    --ink: #cccccc;                 /* editor.foreground */
    --paper: #1f1f1f;               /* editor.background */
    --panel: #181818;               /* sideBar.background */
    --green: #0078d4;               /* button.background — the primary action */
    --on-green: #ffffff;
    --green-deep: #89d185;          /* charts.green — the line on a chart */
    --green-soft: #04395e;          /* list.activeSelectionBackground */
    --yellow: #cca700;              /* editorWarning / charts.yellow */
    --on-yellow: #1f1f1f;
    --yellow-soft: #33302a;
    --red: #f14c4c;                 /* editorError.foreground */
    --on-red: #1f1f1f;
    --red-soft: #3a2323;
    --grey: #313131;                /* button.secondary */
    --hair: #2b2b2b;                /* the default panel border */
    --hair-soft: #252525;
    --veil: rgba(24,24,24,.9);
    --ring-green: rgba(0,120,212,.3);
    --ring-yellow: rgba(204,167,0,.25);
    --ring-red: rgba(241,76,76,.28);
    --ring-grey: rgba(150,150,150,.16);
    --ring-ink: rgba(204,204,204,.3);
    --shadow-col: #000;
    --wash-a: #262626;
    --wash-b: #1c2530;
  }
  :root[data-theme="light"] {
    --ink: #3b3b3b;                 /* editor.foreground */
    --paper: #ffffff;               /* editor.background */
    --panel: #f8f8f8;               /* sideBar.background */
    --green: #005fb8;               /* button.background */
    --on-green: #ffffff;
    --green-deep: #388a34;          /* charts.green */
    --green-soft: #e4edf7;
    --yellow: #bf8803;              /* charts.yellow */
    --on-yellow: #ffffff;
    --yellow-soft: #f3f1ea;
    --red: #cd3131;                 /* editorError.foreground */
    --on-red: #ffffff;
    --red-soft: #fbe9e9;
    --grey: #e5e5e5;
    --hair: #e5e5e5;                /* the default panel border */
    --hair-soft: #f0f0f0;
    --veil: rgba(248,248,248,.92);
    --ring-green: rgba(0,95,184,.22);
    --ring-yellow: rgba(191,136,3,.22);
    --ring-red: rgba(205,49,49,.2);
    --ring-grey: rgba(120,120,120,.16);
    --ring-ink: rgba(59,59,59,.3);
    --shadow-col: #3b3b3b;
    --wash-a: #fbfbfb;
    --wash-b: #f6f8fb;
  }
  :root[data-theme="peas"] {
    --ink: #16170f;
    --paper: #fffdf2;
    --panel: #ffffff;
    --green: #34c759;
    --on-green: #16170f;
    --green-deep: #1f8f3e;
    --green-soft: #ddf7e2;
    --yellow: #ffd43b;
    --on-yellow: #16170f;
    --yellow-soft: #fff3c4;
    --red: #ff5a4e;
    --on-red: #16170f;
    --red-soft: #ffe2de;
    --grey: #c2c5bd;
    --hair: rgba(22,23,15,.22);
    --hair-soft: rgba(22,23,15,.12);
    --veil: rgba(255,253,242,.75);
    --ring-green: rgba(52,199,89,.25);
    --ring-yellow: rgba(255,212,59,.25);
    --ring-red: rgba(255,90,78,.25);
    --ring-grey: rgba(120,124,116,.2);
    --ring-ink: rgba(22,23,15,.35);
    --shadow-col: #16170f;
    --wash-a: #fff3c4;
    --wash-b: #ddf7e2;
  }
  /* Five built on the colour wheel rather than copied: each picks ONE relationship and
     holds to it, with surfaces in the base hue at low saturation, accents at a matched
     lightness so no one of them shouts, and --on-* chosen by contrast ratio against
     each fill. --green is the primary action, --green-deep the chart line. */
  :root[data-theme="cobalt"] {            /* Copper & Cobalt — complementary, 215 vs 30 */
    --ink: #d6dae0; --paper: #13161b; --panel: #1b2027;
    --green: #4987df; --on-green: #0e131b; --green-deep: #64bbd8;
    --green-soft: #28313e; --yellow: #d8ab79; --on-yellow: #0e131b;
    --yellow-soft: #3e3428; --red: #d87364; --on-red: #0e131b;
    --red-soft: #3e2b28; --grey: #353c46; --hair: #353c46;
    --hair-soft: #252a31; --veil: rgba(0,0,0,.85); --ring-green: #4987df55;
    --ring-yellow: #d8ab7944; --ring-red: #d8736444; --ring-grey: #353c4644;
    --ring-ink: #d6dae04d; --shadow-col: #080a0d; --wash-a: #1f252e;
    --wash-b: #1d232a;
  }
  :root[data-theme="plum"] {            /* Plum & Citron — split-complementary, 290 vs 70/110 */
    --ink: #ded6e0; --paper: #19131b; --panel: #251b27;
    --green: #9949df; --on-green: #f8f6f9; --green-deep: #77d864;
    --green-soft: #34283e; --yellow: #ced879; --on-yellow: #180e1b;
    --yellow-soft: #3c3e28; --red: #d86473; --on-red: #180e1b;
    --red-soft: #3e282b; --grey: #423546; --hair: #423546;
    --hair-soft: #2f2531; --veil: rgba(0,0,0,.85); --ring-green: #9949df55;
    --ring-yellow: #ced87944; --ring-red: #d8647344; --ring-grey: #42354644;
    --ring-ink: #ded6e04d; --shadow-col: #0c080d; --wash-a: #2b1f2e;
    --wash-b: #241d2a;
  }
  :root[data-theme="terracotta"] {            /* Terracotta Triad — triadic, 20 / 140 / 260 */
    --ink: #3e3028; --paper: #fcf9f8; --panel: #f5f1ef;
    --green: #7051b8; --on-green: #f9f7f6; --green-deep: #279b57;
    --green-soft: #eae6f4; --yellow: #b28638; --on-yellow: #1b130e;
    --yellow-soft: #f4efe6; --red: #c15033; --on-red: #f9f7f6;
    --red-soft: #f4e9e6; --grey: #e6dfdb; --hair: rgba(0,0,0,.18);
    --hair-soft: rgba(0,0,0,.09); --veil: rgba(255,255,255,.88); --ring-green: #7051b855;
    --ring-yellow: #b2863844; --ring-red: #c1503344; --ring-grey: #e6dfdb44;
    --ring-ink: #3e30284d; --shadow-col: #46342a; --wash-a: #f8f4ed;
    --wash-b: #f0eef7;
  }
  :root[data-theme="moss"] {            /* Moss Analogous — 90 / 120 / 160 neighbours */
    --ink: #d6e0d6; --paper: #131b13; --panel: #1b271b;
    --green: #49df99; --on-green: #0e1b0e; --green-deep: #8bd864;
    --green-soft: #283e34; --yellow: #abd879; --on-yellow: #0e1b0e;
    --yellow-soft: #343e28; --red: #d88b64; --on-red: #0e1b0e;
    --red-soft: #3e2f28; --grey: #354635; --hair: #354635;
    --hair-soft: #253125; --veil: rgba(0,0,0,.85); --ring-green: #49df9955;
    --ring-yellow: #abd87944; --ring-red: #d88b6444; --ring-grey: #35463544;
    --ring-ink: #d6e0d64d; --shadow-col: #080d08; --wash-a: #1f2e1f;
    --wash-b: #1d2a24;
  }
  :root[data-theme="porcelain"] {            /* Porcelain & Ink — near-monochrome 210 with one saffron */
    --ink: #28333e; --paper: #f8fafc; --panel: #eff2f5;
    --green: #226dc3; --on-green: #f6f7f9; --green-deep: #276b9b;
    --green-soft: #e6edf4; --yellow: #b28c34; --on-yellow: #0e141b;
    --yellow-soft: #f4f0e6; --red: #b82e32; --on-red: #f6f7f9;
    --red-soft: #f4e6e6; --grey: #dbe0e6; --hair: rgba(0,0,0,.18);
    --hair-soft: rgba(0,0,0,.09); --veil: rgba(255,255,255,.88); --ring-green: #226dc355;
    --ring-yellow: #b28c3444; --ring-red: #b82e3244; --ring-grey: #dbe0e644;
    --ring-ink: #28333e4d; --shadow-col: #2a3846; --wash-a: #f8f5ed;
    --wash-b: #eef2f7;
  }
  :root {
    --line: 4px;
    --pop: 6px 6px 0 var(--shadow-col);
    --pop-sm: 4px 4px 0 var(--shadow-col);
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0; overflow: hidden;
    background: var(--paper);
    background-image:
      radial-gradient(circle at 12% 8%, var(--wash-a) 0, transparent 42%),
      radial-gradient(circle at 88% 92%, var(--wash-b) 0, transparent 45%);
    color: var(--ink);
    font: 600 18px/1.45 ui-rounded, "Nunito", "Segoe UI Variable", system-ui, -apple-system, sans-serif;
    display: flex; flex-direction: column;
  }

  /* connection light — no words while everything is fine */
  #lamp {
    position: fixed; top: 16px; right: 18px; z-index: 5;
    width: 20px; height: 20px; border-radius: 50%;
    background: var(--green); border: 3px solid var(--ink);
    box-shadow: 0 0 0 4px var(--ring-green);
  }
  /* same lamp shape, one below the other — grey and quiet */
  #wipe {
    position: fixed; top: 50px; right: 18px; z-index: 5;
    display: grid; place-items: center; padding: 0;
    width: 20px; height: 20px; border-radius: 50%;
    font: 900 10px/1 inherit; color: var(--ink);
    background: var(--grey); border: 3px solid var(--ink);
    box-shadow: 0 0 0 4px var(--ring-grey);
    cursor: pointer; opacity: .6; transition: opacity .12s, background .12s;
  }
  #wipe:hover { opacity: 1; background: var(--yellow); color: var(--on-yellow); }
  /* third lamp in the same column: the timeline toggle */
  #tl-btn {
    position: fixed; top: 84px; right: 18px; z-index: 6;
    display: grid; place-items: center; padding: 0;
    width: 20px; height: 20px; border-radius: 50%;
    font: 900 11px/1 inherit; color: var(--on-yellow);
    background: var(--yellow); border: 3px solid var(--ink);
    box-shadow: 0 0 0 4px var(--ring-yellow);
    cursor: pointer; opacity: .75; transition: opacity .12s;
  }
  #tl-btn:hover, #tl-btn.on { opacity: 1; }
  /* open = the same yellow, ringed in ink, so the button never changes identity */
  #tl-btn.on { box-shadow: 0 0 0 4px var(--ring-ink); }

  /* fourth lamp: the palette picker */
  #pal-btn {
    position: fixed; top: 118px; right: 18px; z-index: 6;
    display: grid; place-items: center; padding: 0;
    width: 20px; height: 20px; border-radius: 50%;
    font: 900 11px/1 inherit; color: var(--on-yellow);
    background: var(--yellow); border: 3px solid var(--ink);
    box-shadow: 0 0 0 4px var(--ring-yellow);
    cursor: pointer; opacity: .75; transition: opacity .12s;
  }
  #pal-btn:hover, #pal-btn.on { opacity: 1; }
  #pal-btn.on { box-shadow: 0 0 0 4px var(--ring-ink); }
  #palette {
    display: none; position: fixed; top: 118px; right: 50px; z-index: 7;
    flex-direction: column; gap: 6px; padding: 10px;
    background: var(--panel); border: 3px solid var(--ink); box-shadow: var(--pop-sm);
  }
  #palette.open { display: flex; }
  #palette button {
    font: inherit; font-size: 15px; font-weight: 800; color: var(--ink); cursor: pointer;
    background: var(--paper); border: 3px solid var(--ink); border-radius: 10px;
    padding: 7px 14px; text-align: left; white-space: nowrap;
    display: flex; align-items: center; gap: 9px;
  }
  #palette button:hover { background: var(--yellow-soft); }
  #palette button[aria-checked="true"] { background: var(--green-soft); }
  #palette .chip {
    flex: none; width: 15px; height: 15px; border-radius: 50%; border: 2px solid var(--ink);
  }

  /* THE TIMELINE — hidden until T. Oldest left, newest right; it scrolls sideways only. */
  #timeline {
    display: none; flex: 0 0 auto; gap: 12px; overflow-x: auto; overflow-y: hidden;
    padding: 12px 56px 12px 22px; border-bottom: var(--line) dashed var(--hair);
    background: var(--veil);
  }
  #timeline.open { display: flex; }
  #timeline .empty-note { font-size: 15px; font-weight: 700; opacity: .5; }
  .thumb {
    flex: 0 0 auto; width: 150px; cursor: pointer; padding: 0; font: inherit; color: var(--ink);
    background: var(--panel); border: 3px solid var(--ink); box-shadow: var(--pop-sm);
    display: flex; flex-direction: column; text-align: left;
  }
  .thumb:hover, .thumb.on { background: var(--yellow-soft); }
  .thumb.on { box-shadow: 0 0 0 var(--ink); transform: translate(4px, 4px); }
  /* the page itself, rendered at full width and scaled down -- a real screen, not a picture of one */
  .thumb .page {
    width: 100%; height: 86px; overflow: hidden; position: relative;
    border-bottom: 3px solid var(--ink); pointer-events: none;
  }
  .thumb .page > div {
    position: absolute; top: 0; left: 0; width: 760px;
    transform: scale(.197); transform-origin: top left;
    display: flex; flex-direction: column; gap: 16px;
  }
  .thumb .when {
    font-size: 11px; font-weight: 800; letter-spacing: .04em; padding: 4px 7px;
    display: flex; justify-content: space-between; gap: 6px;
  }
  .thumb .when i { font-style: normal; opacity: .55; }

  #lamp.off { background: var(--red); box-shadow: 0 0 0 4px var(--ring-red); animation: blink 1s steps(2) infinite; }
  @keyframes blink { 50% { opacity: .35; } }

  /* two columns: the decision on the left, whatever it opens on the right */
  #stage {
    flex: 1; overflow: hidden; display: grid; gap: 22px; padding: 22px 22px 12px;
    grid-template-columns: 1fr 1fr; align-items: stretch;
  }
  /* the left column shrinks to fit FIRST, and only scrolls once shrinking would make
     the text too small to read (the floor is in fit()) */
  /* ⚠️ align-items:center CLIPS THE TOP once the content is taller than the column:
     a centred flex item overflows in BOTH directions and the part above the start edge
     cannot be scrolled to. Auto margins centre the same way while it fits and collapse
     to zero when it does not, so the top stays reachable. */
  #left {
    overflow-y: auto; overflow-x: hidden;
    display: flex; flex-direction: column; align-items: center;
  }
  #fit { width: 100%; max-width: 760px; margin: auto 0; }
  /* the right one MAY scroll: detail is not a decision and does not have to fit a screen */
  #detail {
    overflow-y: auto; border-left: var(--line) dashed var(--hair); padding: 4px 4px 4px 22px;
    display: flex; flex-direction: column; gap: 16px;
  }
  #detail.empty { align-items: center; justify-content: center; border-left-color: var(--hair-soft); }
  /* A scrollable surface says so: the overlay bar the OS draws is invisible until you
     already scrolled, which is too late to tell you there is more below. */
  #left, #detail, #timeline { scrollbar-width: thin; scrollbar-color: var(--ink) transparent; }
  #left::-webkit-scrollbar, #detail::-webkit-scrollbar, #timeline::-webkit-scrollbar { width: 12px; height: 12px; }
  #left::-webkit-scrollbar-track, #detail::-webkit-scrollbar-track, #timeline::-webkit-scrollbar-track { background: transparent; }
  #left::-webkit-scrollbar-thumb, #detail::-webkit-scrollbar-thumb, #timeline::-webkit-scrollbar-thumb {
    background: var(--ink); border: 3px solid var(--paper); border-radius: 999px;
  }
  #detail .placeholder {
    font-size: 15px; font-weight: 700; letter-spacing: .04em; text-transform: uppercase;
    opacity: .32; text-align: center; max-width: 26ch; line-height: 1.6;
  }
  #detail h2 {
    margin: 0; font-size: 25px; font-weight: 900; letter-spacing: -.02em; line-height: 1.15;
  }
  .cards button.on { background: var(--yellow); color: var(--on-yellow); box-shadow: 0 0 0 var(--ink); transform: translate(4px, 4px); }
  @media (max-width: 900px) {
    #stage { grid-template-columns: 1fr; grid-template-rows: 1fr auto; }
    #detail { border-left: none; border-top: var(--line) dashed var(--hair); padding: 16px 4px 4px; max-height: 45%; }
  }
  #screen {
    width: 100%; transform-origin: top left;
    display: flex; flex-direction: column; gap: 16px;
  }
  #screen.pop { animation: pop .26s cubic-bezier(.2,.9,.3,1.2); }
  @keyframes pop { from { opacity: 0; } }

  .crumb {
    align-self: flex-start; font-size: 15px; font-weight: 700;
    background: var(--panel); border: 3px solid var(--ink); border-radius: 999px;
    padding: 5px 15px;
    max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  .crumb::before { content: "YOU SAID: "; font-size: 12px; letter-spacing: .05em; opacity: .55; }
  /* a long command is cut to one line, and opens on hover or click: what you asked is
     often the context for what came back */
  .crumb { cursor: pointer; }
  .crumb:hover, .crumb.open {
    white-space: normal; overflow: visible; border-radius: 18px; max-width: 100%;
    background: var(--yellow-soft);
  }

  .badge {
    align-self: flex-start; font-size: 17px; font-weight: 800; letter-spacing: .01em;
    padding: 9px 18px; border: 3px solid var(--ink); border-radius: 999px;
    text-transform: uppercase;
  }
  .badge.ok { background: var(--green); color: var(--on-green); }
  .badge.warn { background: var(--yellow); color: var(--on-yellow); }
  .badge.err { background: var(--red); color: var(--on-red); }
  .badge.wait { background: var(--panel); text-transform: none; }

  .ask {
    margin: 0; font-size: clamp(30px, 5vw, 46px); line-height: 1.08;
    font-weight: 900; letter-spacing: -.03em;
  }
  .say { margin: 0; font-size: clamp(19px, 2.3vw, 23px); line-height: 1.4; font-weight: 650; }
  .note { margin: 0; font-size: 16px; font-weight: 600; opacity: .7; }
  .plain { margin: 0; font-size: 18px; white-space: pre-wrap; }

  .stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(215px, 1fr)); gap: 12px; }
  .stat {
    background: var(--yellow-soft); border: 3px solid var(--ink);
    border-radius: 14px; padding: 13px 16px;
  }
  .stat b {
    display: block; font-size: 13px; font-weight: 800; letter-spacing: .06em;
    text-transform: uppercase; opacity: .6; margin-bottom: 3px;
  }
  .stat span { font-size: 24px; font-weight: 900; letter-spacing: -.02em; }

  /* A chart is a stat that moved: same card, same ink, one line of data. */
  .chart {
    background: var(--panel); border: 3px solid var(--ink);
    border-radius: 14px; padding: 13px 16px;
  }
  .chart b {
    display: block; font-size: 13px; font-weight: 800; letter-spacing: .06em;
    text-transform: uppercase; opacity: .6; margin-bottom: 6px;
  }
  .chart svg { display: block; width: 100%; height: auto; }
  .chart .foot {
    display: flex; justify-content: space-between;
    font-size: 13px; font-weight: 800; opacity: .6; margin-top: 4px;
  }
  .chart .foot .now { opacity: 1; color: var(--green-deep); }

  /* ::html — a raw fragment. It gets the panel's type and a readable table by default. */
  .raw { font-size: 16px; }
  .raw table { border-collapse: collapse; width: 100%; font-variant-numeric: tabular-nums; }
  .raw th, .raw td { border: 2px solid var(--ink); padding: 6px 10px; text-align: left; }
  .raw th { background: var(--yellow-soft); font-size: 13px; letter-spacing: .05em; text-transform: uppercase; }
  .raw img, .raw svg { max-width: 100%; height: auto; }

  /* two across on any reasonable width, one across on a narrow pane */
  .cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(190px, 1fr)); gap: 12px; }
  .cards button {
    text-align: left; font: inherit; cursor: pointer; color: var(--ink);
    background: var(--yellow-soft); border: var(--line) solid var(--ink);
    box-shadow: var(--pop-sm); padding: 14px 15px 12px; border-radius: 0;
    display: flex; flex-direction: column; gap: 8px; min-height: 96px;
  }
  .cards button:hover { background: var(--yellow); color: var(--on-yellow); }
  .cards button:active { transform: translate(4px, 4px); box-shadow: 0 0 0 var(--ink); }
  .cards button b { font-size: 17px; font-weight: 800; line-height: 1.25; letter-spacing: -.01em; }
  .cards button .more {
    margin-top: auto; font-size: 11px; font-weight: 700; letter-spacing: .1em;
    text-transform: uppercase; opacity: .6;
  }
  .picks {
    display: grid; gap: 14px; margin-top: 4px;
    grid-template-columns: repeat(auto-fit, minmax(270px, 1fr));
  }
  .picks button {
    display: flex; align-items: center; gap: 14px; text-align: left; width: 100%;
    min-height: 104px; font: inherit; font-size: 19px; font-weight: 800; color: var(--ink);
    line-height: 1.22;
    background: var(--green-soft); border: var(--line) solid var(--ink);
    border-radius: 20px; padding: 16px 18px; cursor: pointer; box-shadow: var(--pop);
    transition: transform .08s, box-shadow .08s, background .12s;
  }
  .picks button:hover { background: var(--green); color: var(--on-green); }
  .picks button:active { transform: translate(6px, 6px); box-shadow: 0 0 0 var(--ink); }
  .picks button kbd {
    flex: none; display: grid; place-items: center; width: 44px; height: 44px;
    font: 900 20px/1 inherit; background: var(--yellow); color: var(--on-yellow);
    border: 3px solid var(--ink); border-radius: 50%;
  }
  .picks button.fill { background: var(--panel); }


  .thinking {
    display: flex; align-items: center; gap: 14px; font-size: 22px; font-weight: 800;
    background: var(--panel); border: var(--line) solid var(--ink);
    border-radius: 20px; padding: 20px 24px; box-shadow: var(--pop);
  }
  .thinking i {
    width: 16px; height: 16px; border-radius: 50%;
    background: var(--green); border: 3px solid var(--ink); animation: bounce 1s infinite;
  }
  .thinking i:nth-child(2) { animation-delay: .15s; background: var(--yellow); }
  .thinking i:nth-child(3) { animation-delay: .3s; }
  @keyframes bounce { 0%, 70%, 100% { transform: translateY(0); } 35% { transform: translateY(-9px); } }

  .fixit {
    background: var(--red-soft); border: var(--line) solid var(--ink);
    border-radius: 22px; padding: 24px; box-shadow: var(--pop);
    display: flex; flex-direction: column; gap: 14px;
  }
  .fixit h1 { margin: 0; font-size: 34px; font-weight: 900; letter-spacing: -.02em; }
  .fixit p { margin: 0; font-size: 19px; font-weight: 650; }
  .fixit code {
    display: block; font: 700 18px/1.5 ui-monospace, Menlo, Consolas, monospace;
    background: var(--panel); border: 3px solid var(--ink); border-radius: 14px;
    padding: 13px 16px; word-break: break-all;
  }

  footer { flex: none; padding: 10px 22px 18px; border-top: var(--line) solid var(--ink); background: var(--paper); }
  form { width: 100%; margin: 0; display: flex; gap: 12px; align-items: flex-end; }
  textarea {
    flex: 1; resize: none; font: inherit; font-size: 19px; font-weight: 650; color: var(--ink);
    background: var(--panel); border: var(--line) solid var(--ink);
    border-radius: 18px; padding: 16px 18px; min-height: 104px; max-height: 220px;
    box-shadow: var(--pop-sm);
  }
  textarea::placeholder { color: var(--ink); opacity: .4; }
  textarea:focus { outline: none; background: var(--yellow-soft); }
  form button {
    font: inherit; font-size: 20px; font-weight: 900; height: 104px; padding: 0 34px;
    background: var(--yellow); color: var(--on-yellow);
    border: var(--line) solid var(--ink); border-radius: 18px; cursor: pointer;
    box-shadow: var(--pop-sm); transition: transform .08s, box-shadow .08s;
  }
  form button:active { transform: translate(4px, 4px); box-shadow: 0 0 0 var(--ink); }
</style>
</head>
<body>
  <button id="wipe" type="button" title="Clear the screen">✕</button>
  <button id="tl-btn" type="button" title="Timeline — past replies">T</button>
  <button id="pal-btn" type="button" title="Colour palette">C</button>
  <div id="palette" role="radiogroup" aria-label="Colour palette"></div>
  <div id="lamp" title="connected"></div>
  <div id="timeline"></div>
  <div id="stage">
    <div id="left"><div id="fit"><div id="screen"></div></div></div>
    <div id="detail" class="empty"></div>
  </div>
  <footer>
    <form id="form">
      <textarea id="input" rows="3" placeholder="Type here…" autofocus></textarea>
      <button type="submit">SEND</button>
    </form>
  </footer>

<script>
  const detail = document.getElementById('detail');
  const fitBox = document.getElementById('fit');
  const screenEl = document.getElementById('screen');
  const input = document.getElementById('input');
  const form  = document.getElementById('form');
  const lamp  = document.getElementById('lamp');
  let since = 0, fails = 0, offline = false, lastCommand = '';
  const BUILD = "__BUILD__";  // server stamps chat.html's mtime here at serve time

  const el = (tag, cls, text) => {
    const n = document.createElement(tag);
    if (cls) n.className = cls;
    if (text !== undefined) n.textContent = text;
    return n;
  };

  /** Shrink the card until it fits the stage, but not past MIN_SCALE — below that the
      text stops being readable from across the room, which is the whole point of this
      panel, so the column scrolls instead. */
  const MIN_SCALE = 0.8;
  function fit() {
    screenEl.style.transform = 'none';
    screenEl.style.width = '100%';
    fitBox.style.height = 'auto';
    if (!screenEl.children.length) return;

    const avail = document.getElementById('left').clientHeight - 12;
    let k = Math.min(1, avail / screenEl.scrollHeight);
    if (k < 1) {
      // widen first so text reflows, then re-measure: a wider box is a shorter box
      screenEl.style.width = (100 / k) + '%';
      k = Math.min(1, Math.max(avail / screenEl.scrollHeight, MIN_SCALE));
      screenEl.style.width = (100 / k) + '%';
      screenEl.style.transform = 'scale(' + k + ')';
    }
    fitBox.style.height = Math.ceil(screenEl.scrollHeight * k) + 'px';
  }

  /** Swap the whole screen — this console never keeps history. */
  function show(nodes, crumb = true) {
    closeSheet();          // a new reply invalidates whatever detail was open
    // ...and it invalidates a held live screen: what was held is no longer live
    held = null; pinned = null;
    const kids = [];
    if (crumb && lastCommand) {
      const c = el('div', 'crumb', lastCommand);
      c.title = lastCommand;                       // hover, for the impatient
      c.onclick = () => { c.classList.toggle('open'); fit(); };
      kids.push(c);
    }
    kids.push(...nodes);
    screenEl.classList.remove('pop');
    screenEl.replaceChildren(...kids);
    void screenEl.offsetWidth;      // restart the entrance animation
    screenEl.classList.add('pop');
    fit();
  }

  function parse(text) {
    const blocks = [];
    for (const raw of text.split('\n')) {
      const line = raw.trim();
      if (!line) continue;
      const m = line.match(/^::(\w+)\s*(.*)$/);
      blocks.push(m ? { type: m[1].toLowerCase(), body: m[2] } : { type: 'plain', body: line });
    }
    return blocks;
  }

  function build(text) { return buildBlocks(parse(text)); }

  const SVGNS = 'http://www.w3.org/2000/svg';
  function svg(tag, attrs) {
    const n = document.createElementNS(SVGNS, tag);
    for (const k in attrs) n.setAttribute(k, attrs[k]);
    return n;
  }

  /** ::chart <title> = v1,v2,v3 — one line, scaled to its own min/max, last point marked.
      The y axis is the series' own range, so a flat line means flat, not zoomed-out. */
  function chart(body) {
    const cut = body.indexOf('=');
    const title = (cut < 0 ? body : body.slice(0, cut)).trim();
    const vals = (cut < 0 ? '' : body.slice(cut + 1))
      .split(',').map(s => parseFloat(s)).filter(v => isFinite(v));
    const box = el('div', 'chart');
    box.append(el('b', '', title));
    if (vals.length < 2) { box.append(el('p', 'note', 'no data')); return box; }

    const W = 600, H = 150, PAD = 8;
    const lo = Math.min(...vals), hi = Math.max(...vals);
    const span = hi - lo || 1;
    const x = i => PAD + i * (W - 2 * PAD) / (vals.length - 1);
    const y = v => H - PAD - (v - lo) / span * (H - 2 * PAD);

    const s = svg('svg', { viewBox: `0 0 ${W} ${H}`, role: 'img', 'aria-label': title });
    s.append(svg('polyline', {
      points: vals.map((v, i) => `${x(i).toFixed(1)},${y(v).toFixed(1)}`).join(' '),
      fill: 'none', stroke: 'var(--green-deep)', 'stroke-width': 4,
      'stroke-linejoin': 'round', 'stroke-linecap': 'round',
    }));
    s.append(svg('circle', {
      cx: x(vals.length - 1), cy: y(vals[vals.length - 1]), r: 7,
      fill: 'var(--yellow)', stroke: 'var(--ink)', 'stroke-width': 3,
    }));
    box.append(s);

    // left = where it started, right = where it is now, middle = the range the line is drawn in,
    // so a reader can tell a real fall from an autoscaled wiggle
    const foot = el('div', 'foot');
    foot.append(el('span', '', String(vals[0])),
                el('span', '', `${lo} – ${hi}`),
                el('span', 'now', String(vals[vals.length - 1])));
    box.append(foot);
    return box;
  }

  /** ::html <fragment>, or ::html … ::endhtml for several lines — injected as real HTML.
      The escape hatch for anything the markup has no directive for: a table, a second
      chart shape, an <img>. Only replies written by this side reach here; a user message
      is shown as the crumb's textContent and is never parsed as markup. */
  function rawHtml(source) {
    const box = el('div', 'raw');
    box.innerHTML = source;
    return box;
  }

  /** Render parsed blocks. Called again for each ::card body, so windows nest naturally. */
  function buildBlocks(blocks) {
    const nodes = [];
    let picks = null, stats = null, cards = null;

    for (let i = 0; i < blocks.length; i++) {
      const b = blocks[i];
      if (b.type === 'card') {
        picks = null; stats = null;
        // collect to the matching ::endcard, counting nested ::card so inner windows survive
        const inner = [];
        let depth = 1;
        while (++i < blocks.length) {
          if (blocks[i].type === 'card') depth++;
          if (blocks[i].type === 'endcard' && --depth === 0) break;
          inner.push(blocks[i]);
        }
        if (!cards) { cards = el('div', 'cards'); nodes.push(cards); }
        const tile = el('button');
        tile.type = 'button';
        tile.append(el('b', '', b.body), el('span', 'more', 'open ▸'));
        tile.onclick = () => openSheet(b.body, inner, tile);
        cards.append(tile);
        continue;
      }
      if (b.type === 'endcard') continue;
      cards = null;
      if (b.type === 'pick' || b.type === 'fill') {
        stats = null;
        if (!picks) { picks = el('div', 'picks'); nodes.push(picks); }
        const isFill = b.type === 'fill';
        const [label, cmd] = b.body.split('=>').map(s => s.trim());
        const btn = el('button', isFill ? 'fill' : '');
        btn.type = 'button';
        btn.dataset.cmd = cmd || label;
        btn.append(el('kbd', '', isFill ? '✎' : String(picks.children.length + 1)));
        btn.append(el('span', '', label));
        btn.onclick = () => isFill
          ? (input.value = btn.dataset.cmd, input.focus())
          : send(btn.dataset.cmd);
        picks.append(btn);
        continue;
      }
      if (b.type === 'kv') {
        picks = null;
        if (!stats) { stats = el('div', 'stats'); nodes.push(stats); }
        const [k, ...rest] = b.body.split('=');
        const box = el('div', 'stat');
        box.append(el('b', '', (k || '').trim()), el('span', '', rest.join('=').trim()));
        stats.append(box);
        continue;
      }
      picks = null; stats = null;
      if (b.type === 'chart') { nodes.push(chart(b.body)); continue; }
      if (b.type === 'html') {
        // `::html <fragment>` is ONE line and consumes nothing after it; only a bare
        // `::html` opens a block, which runs to ::endhtml. Consuming after a one-liner
        // silently ate the next directive -- a reply lost its closing line to it.
        if (b.body) { nodes.push(rawHtml(b.body)); continue; }
        const parts = [];
        while (i + 1 < blocks.length && blocks[i + 1].type !== 'endhtml') {
          parts.push(blocks[++i].body);
        }
        i++;                                   // step over ::endhtml (or off the end)
        nodes.push(rawHtml(parts.join('\n')));
        continue;
      }
      if (b.type === 'endhtml') continue;
      switch (b.type) {
        case 'ask':  nodes.push(el('h1', 'ask', b.body)); break;
        case 'say':  nodes.push(el('p', 'say', b.body)); break;
        case 'note': nodes.push(el('p', 'note', b.body)); break;
        case 'ok': case 'warn': case 'err':
          nodes.push(el('div', 'badge ' + b.type, b.body)); break;
        case 'wait': nodes.push(el('div', 'badge wait', b.body)); break;
        default: nodes.push(el('p', 'plain', b.body));
      }
    }
    return nodes;
  }

  /* The right pane is the detail surface: empty until something on the left is chosen,
     and it may scroll, because detail is not a decision and need not fit one screen. */
  let sheet = null;                       // the pane when it holds something, else null
  function closeSheet() {
    detail.replaceChildren(el('p', 'placeholder', 'Pick something on the left'));
    detail.classList.add('empty');
    screenEl.querySelectorAll('.cards button.on').forEach(b => b.classList.remove('on'));
    sheet = null;
  }
  function openSheet(title, blocks, tile) {
    detail.classList.remove('empty');
    detail.replaceChildren(el('h2', '', title), ...buildBlocks(blocks));
    detail.scrollTop = 0;
    screenEl.querySelectorAll('.cards button.on').forEach(b => b.classList.remove('on'));
    if (tile) tile.classList.add('on');
    sheet = detail;
  }

  function waiting() {
    const box = el('div', 'thinking');
    box.append(el('i'), el('i'), el('i'), el('span', '', 'Working on it…'));
    show([box]);
  }

  /** The only time words appear about the connection: when it is broken. */
  function showOffline() {
    const card = el('div', 'fixit');
    card.append(
      el('h1', '', 'The panel is switched off'),
      el('p', '', 'The little program that runs this page has stopped. Open the terminal and type this:'),
      el('code', '', 'python3 chat_server.py'),
      el('p', '', 'This page turns itself back on within a second. Nothing is lost.'),
    );
    show([card], false);
  }

  async function send(text) {
    text = (text || '').trim();
    if (!text) return true;
    lastCommand = text;
    waiting();
    try {
      await fetch('/api/send', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ text }),
      });
      poll();
      return true;
    } catch {
      showOffline();
      return false;
    }
  }

  async function poll() {
    try {
      const res = await fetch('/api/messages?since=' + since + '&v=' + BUILD, { cache: 'no-store' });
      const data = await res.json();
      if (data.build && BUILD !== "__BUILD__" && data.build !== BUILD) return location.reload();

      fails = 0;
      lamp.classList.remove('off');
      if (offline) { offline = false; since = 0; return; }  // redraw from history next tick
      if (!data.messages.length) return;
      since = data.last;

      // A command with no answer yet must keep showing "working" — never fall
      // back to the previous card, which reads as "nothing happened".
      const newest = data.messages[data.messages.length - 1];
      if (newest.role === 'user') {
        lastCommand = newest.text;
        waiting();
        return;
      }
      const before = data.messages.slice(0, data.messages.indexOf(newest)).reverse().find(m => m.role === 'user');
      if (before) lastCommand = before.text;
      show(build(newest.text));
    } catch {
      lamp.classList.add('off');
      if (++fails >= 2 && !offline) { offline = true; showOffline(); }
    }
  }

  form.addEventListener('submit', async (e) => {
    e.preventDefault();
    const text = input.value;
    input.value = ''; input.style.height = 'auto';
    if (await send(text) === false) input.value = text;
  });

  input.addEventListener('keydown', (e) => {
    if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); form.requestSubmit(); }
  });
  input.addEventListener('input', () => {
    input.style.height = 'auto';
    input.style.height = Math.min(input.scrollHeight, 150) + 'px';
    fit();  // a taller composer leaves less room for the card
  });

  window.addEventListener('resize', fit);

  /* ---- PALETTE -------------------------------------------------------------
     Three token sets in the stylesheet; this only stamps data-theme on <html> and
     remembers the choice. Dark is the default, so an empty stamp is already right —
     the read is wrapped because localStorage throws in a locked-down browser. ---- */
  const THEMES = [
    { id: 'dark',  name: 'Dark mode',      chip: '#1f1f1f' },
    { id: 'light', name: 'Light mode',     chip: '#ffffff' },
    { id: 'peas',  name: 'Peas with corn', chip: '#ffd43b' },
    { id: 'cobalt',     name: 'Copper & Cobalt', chip: '#4987df' },
    { id: 'plum',       name: 'Plum & Citron',   chip: '#9949df' },
    { id: 'terracotta', name: 'Terracotta Triad', chip: '#c96a3e' },
    { id: 'moss',       name: 'Moss',            chip: '#49df99' },
    { id: 'porcelain',  name: 'Porcelain & Ink', chip: '#226dc3' },
  ];
  const palBtn = document.getElementById('pal-btn');
  const palEl = document.getElementById('palette');

  function applyTheme(id) {
    document.documentElement.dataset.theme = id;
    try { localStorage.setItem('ctrl-theme', id); } catch {}
    palEl.querySelectorAll('button').forEach(b =>
      b.setAttribute('aria-checked', String(b.dataset.id === id)));
  }

  THEMES.forEach(t => {
    const b = el('button');
    b.type = 'button';
    b.dataset.id = t.id;
    b.setAttribute('role', 'radio');
    const chip = el('span', 'chip');
    chip.style.background = t.chip;
    b.append(chip, el('span', '', t.name));
    b.onclick = () => { applyTheme(t.id); palEl.classList.remove('open'); palBtn.classList.remove('on'); };
    palEl.append(b);
  });

  palBtn.onclick = () => {
    const open = palEl.classList.toggle('open');
    palBtn.classList.toggle('on', open);
  };
  applyTheme(document.documentElement.dataset.theme || 'light');

  /* ---- TIMELINE ------------------------------------------------------------
     Past replies, re-rendered by the same builder rather than stored as pictures,
     so an old screen shows exactly what it showed then. Hovering one puts it in the
     left column; the live screen is held aside and put back on the way out. A click
     pins it, so you can open its cards. ------------------------------------------ */
  const tlEl = document.getElementById('timeline');
  const tlBtn = document.getElementById('tl-btn');
  let tlOpen = false, held = null, pinned = null;

  const clock = (ts) => (ts || '').slice(11, 16);

  function holdLive() { if (!held) held = [...screenEl.children]; }
  function restoreLive() {
    if (!held) return;
    screenEl.replaceChildren(...held);
    held = null;
    fit();
  }
  function markThumb(btn) {
    tlEl.querySelectorAll('.thumb.on').forEach(t => t.classList.remove('on'));
    if (btn) btn.classList.add('on');
  }
  function showArchived(msg) {
    holdLive();
    closeSheet();
    screenEl.replaceChildren(...build(msg.text));
    fit();
  }

  function thumbOf(msg, n) {
    const btn = el('button', 'thumb');
    btn.type = 'button';
    btn.title = 'reply ' + n + ' — hover to read, click to pin';
    const page = el('div', 'page');
    const inner = el('div');
    inner.append(...build(msg.text));
    page.append(inner);
    const when = el('div', 'when');
    when.append(el('span', '', clock(msg.ts)), el('i', '', '#' + n));
    btn.append(page, when);

    btn.onmouseenter = () => { if (!pinned) { showArchived(msg); markThumb(btn); } };
    btn.onmouseleave = () => { if (!pinned) { restoreLive(); markThumb(null); } };
    btn.onclick = () => {
      if (pinned === msg) { pinned = null; restoreLive(); markThumb(null); return; }
      pinned = msg; showArchived(msg); markThumb(btn);
    };
    return btn;
  }

  async function openTimeline() {
    tlOpen = true;
    tlEl.classList.add('open');
    tlBtn.classList.add('on');
    tlEl.replaceChildren(el('p', 'empty-note', 'loading…'));
    let msgs;
    try {
      msgs = (await (await fetch('/api/messages?since=0', { cache: 'no-store' })).json()).messages || [];
    } catch {
      return tlEl.replaceChildren(el('p', 'empty-note', 'offline — cannot read the log'));
    }
    const replies = msgs.filter(m => m.role === 'assistant');
    if (!replies.length) return tlEl.replaceChildren(el('p', 'empty-note', 'no replies yet'));
    tlEl.replaceChildren(...replies.map((m, i) => thumbOf(m, i + 1)));
    tlEl.scrollLeft = tlEl.scrollWidth;      // newest first to the eye, at the right edge
    fit();
  }

  function closeTimeline() {
    tlOpen = false;
    pinned = null;
    restoreLive();
    tlEl.classList.remove('open');
    tlEl.replaceChildren();
    tlBtn.classList.remove('on');
    fit();
  }

  tlBtn.onclick = () => (tlOpen ? closeTimeline() : openTimeline());

  document.getElementById('wipe').onclick = () => {
    lastCommand = '';
    show([], false);      // nothing new arrives until the next reply, so it stays blank
    input.focus();
  };

  document.addEventListener('keydown', (e) => {
    if (e.key === 'Escape' && sheet) { e.preventDefault(); return closeSheet(); }
    if (e.key === 'Escape' && tlOpen) { e.preventDefault(); return closeTimeline(); }
    if (!/^[1-9]$/.test(e.key) || e.metaKey || e.ctrlKey || e.altKey) return;
    if (input.value.trim()) return;
    const surface = sheet || screenEl;
    const btn = surface.querySelectorAll('.picks button:not(.fill)')[Number(e.key) - 1];
    if (!btn) return;
    e.preventDefault();
    btn.click();
  });

  closeSheet();          // the right pane starts empty, with its prompt
  poll();
  setInterval(poll, 1000);
</script>
</body>
</html>
