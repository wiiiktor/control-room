<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Control</title>
<!--
  Single-screen cartoon control panel. Every assistant reply REPLACES the screen.
  CTRL markup, one directive per line:

    ::ask   <text>              huge headline question
    ::say   <text>              lead statement
    ::note  <text>              small secondary detail
    ::kv    <key> = <value>     yellow stat tile (they tile into a grid)
    ::ok|::warn|::err <text>    status badge
    ::wait  <text>              pending badge
    ::pick  <label>             big green choice button — click sends <label>
    ::pick  <label> => <cmd>    button showing <label>, sending <cmd>
    ::fill  <text>              button that pre-fills the composer instead of sending
    ::chart <title> = v1,v2,..  small line chart, scaled to its own min/max
    ::html  <fragment>          raw HTML; ::html .. ::endhtml for several lines
    ::card  <title>             clickable tile; lines until ::endcard open in the right pane
    ::endcard                   closes the most recent ::card

  The yellow C picks the palette: "peas with corn" (default), light, dark, and five more.
  Press 1-9 to choose while the composer is empty. The yellow T opens the timeline:
  every past reply, re-rendered small; hover one to read it full size on the left.
-->
<script>
  // Before the first paint, so the page never flashes the wrong palette.
  try { document.documentElement.dataset.theme = localStorage.getItem('ctrl-theme') || 'peas'; }
  catch { document.documentElement.dataset.theme = 'peas'; }
</script>
<style>
  /* ---- PALETTES -------------------------------------------------------------
     Chosen with the yellow C. :root holds dark, but "peas with corn" is the DEFAULT and
     is stamped on <html> before the first paint. Dark and light are editor-ish rather than literal --
     a 2026-09-24 pass replaced them with the Dark Modern / Light Modern values and was
     reverted the same night: the blue-primary version was more faithful and less
     pleasant to use. --on-green / --on-yellow / --on-red carry the text that sits ON
     each filled accent, which matters once a palette's accents are not all light.
     ---------------------------------------------------------------------------- */
  :root, :root[data-theme="dark"] {
    --ink: #d4d4d4; --paper: #1e1e1e; --panel: #252526;
    --green: #4ec9b0; --on-green: #16170f; --green-deep: #6bd6bd; --green-soft: #24352f;
    --yellow: #dcdcaa; --on-yellow: #16170f; --yellow-soft: #37341f;
    --red: #f14c4c; --on-red: #16170f; --red-soft: #402424;
    --grey: #4a4a4a; --hair: rgba(212,212,212,.24); --hair-soft: rgba(212,212,212,.12);
    --veil: rgba(30,30,30,.82);
    --ring-green: rgba(78,201,176,.28); --ring-yellow: rgba(220,220,170,.22);
    --ring-red: rgba(241,76,76,.28); --ring-grey: rgba(160,160,160,.18);
    --ring-ink: rgba(212,212,212,.32); --shadow-col: #000;
    --wash-a: #2b2b21; --wash-b: #1f2d29;
  }
  :root[data-theme="light"] {
    --ink: #1f1f1f; --paper: #ffffff; --panel: #f3f3f3;
    --green: #3aa45f; --on-green: #16170f; --green-deep: #1b7a3f; --green-soft: #e6f2ea;
    --yellow: #ffcc33; --on-yellow: #16170f; --yellow-soft: #f2f2ee;
    --red: #e51400; --on-red: #16170f; --red-soft: #ffe3e0;
    --grey: #c9c9c9; --hair: rgba(31,31,31,.22); --hair-soft: rgba(31,31,31,.12);
    --veil: rgba(255,255,255,.82);
    --ring-green: rgba(58,164,95,.25); --ring-yellow: rgba(255,204,51,.25);
    --ring-red: rgba(229,20,0,.22); --ring-grey: rgba(120,120,120,.18);
    --ring-ink: rgba(31,31,31,.35); --shadow-col: #1f1f1f;
    --wash-a: #fbfaf6; --wash-b: #f5f8f6;
  }
  :root[data-theme="peas"] {
    --ink: #16170f;
    --paper: #fffdf2;
    --panel: #ffffff;
    --green: #34c759;
    --on-green: #16170f;
    --green-deep: #1f8f3e;
    --green-soft: #ddf7e2;
    --yellow: #ffd43b;
    --on-yellow: #16170f;
    --yellow-soft: #fff3c4;
    --red: #ff5a4e;
    --on-red: #16170f;
    --red-soft: #ffe2de;
    --grey: #c2c5bd;
    --hair: rgba(22,23,15,.22);
    --hair-soft: rgba(22,23,15,.12);
    --veil: rgba(255,253,242,.75);
    --ring-green: rgba(52,199,89,.25);
    --ring-yellow: rgba(255,212,59,.25);
    --ring-red: rgba(255,90,78,.25);
    --ring-grey: rgba(120,124,116,.2);
    --ring-ink: rgba(22,23,15,.35);
    --shadow-col: #16170f;
    --wash-a: #fff3c4;
    --wash-b: #ddf7e2;
  }
  /* Five built on the colour wheel rather than copied: each picks ONE relationship and
     holds to it, with surfaces in the base hue at low saturation, accents at a matched
     lightness so no one of them shouts, and --on-* chosen by contrast ratio against
     each fill. --green is the primary action, --green-deep the chart line. */
  :root[data-theme="cobalt"] {            /* Copper & Cobalt — complementary, 215 vs 30 */
    --ink: #d6dae0; --paper: #13161b; --panel: #1b2027;
    --green: #4987df; --on-green: #0e131b; --green-deep: #64bbd8;
    --green-soft: #28313e; --yellow: #d8ab79; --on-yellow: #0e131b;
    --yellow-soft: #3e3428; --red: #d87364; --on-red: #0e131b;
    --red-soft: #3e2b28; --grey: #353c46; --hair: #353c46;
    --hair-soft: #252a31; --veil: rgba(0,0,0,.85); --ring-green: #4987df55;
    --ring-yellow: #d8ab7944; --ring-red: #d8736444; --ring-grey: #353c4644;
    --ring-ink: #d6dae04d; --shadow-col: #080a0d; --wash-a: #1f252e;
    --wash-b: #1d232a;
  }
  :root[data-theme="plum"] {            /* Plum & Citron — split-complementary, 290 vs 70/110 */
    --ink: #ded6e0; --paper: #19131b; --panel: #251b27;
    --green: #9949df; --on-green: #f8f6f9; --green-deep: #77d864;
    --green-soft: #34283e; --yellow: #ced879; --on-yellow: #180e1b;
    --yellow-soft: #3c3e28; --red: #d86473; --on-red: #180e1b;
    --red-soft: #3e282b; --grey: #423546; --hair: #423546;
    --hair-soft: #2f2531; --veil: rgba(0,0,0,.85); --ring-green: #9949df55;
    --ring-yellow: #ced87944; --ring-red: #d8647344; --ring-grey: #42354644;
    --ring-ink: #ded6e04d; --shadow-col: #0c080d; --wash-a: #2b1f2e;
    --wash-b: #241d2a;
  }
  :root[data-theme="terracotta"] {            /* Terracotta Triad — triadic, 20 / 140 / 260 */
    --ink: #3e3028; --paper: #fcf9f8; --panel: #f5f1ef;
    --green: #7051b8; --on-green: #f9f7f6; --green-deep: #279b57;
    --green-soft: #eae6f4; --yellow: #b28638; --on-yellow: #1b130e;
    --yellow-soft: #f4efe6; --red: #c15033; --on-red: #f9f7f6;
    --red-soft: #f4e9e6; --grey: #e6dfdb; --hair: rgba(0,0,0,.18);
    --hair-soft: rgba(0,0,0,.09); --veil: rgba(255,255,255,.88); --ring-green: #7051b855;
    --ring-yellow: #b2863844; --ring-red: #c1503344; --ring-grey: #e6dfdb44;
    --ring-ink: #3e30284d; --shadow-col: #46342a; --wash-a: #f8f4ed;
    --wash-b: #f0eef7;
  }
  :root[data-theme="moss"] {            /* Moss Analogous — 90 / 120 / 160 neighbours */
    --ink: #d6e0d6; --paper: #131b13; --panel: #1b271b;
    --green: #49df99; --on-green: #0e1b0e; --green-deep: #8bd864;
    --green-soft: #283e34; --yellow: #abd879; --on-yellow: #0e1b0e;
    --yellow-soft: #343e28; --red: #d88b64; --on-red: #0e1b0e;
    --red-soft: #3e2f28; --grey: #354635; --hair: #354635;
    --hair-soft: #253125; --veil: rgba(0,0,0,.85); --ring-green: #49df9955;
    --ring-yellow: #abd87944; --ring-red: #d88b6444; --ring-grey: #35463544;
    --ring-ink: #d6e0d64d; --shadow-col: #080d08; --wash-a: #1f2e1f;
    --wash-b: #1d2a24;
  }
  :root[data-theme="porcelain"] {            /* Porcelain & Ink — near-monochrome 210 with one saffron */
    --ink: #28333e; --paper: #f8fafc; --panel: #eff2f5;
    --green: #226dc3; --on-green: #f6f7f9; --green-deep: #276b9b;
    --green-soft: #e6edf4; --yellow: #b28c34; --on-yellow: #0e141b;
    --yellow-soft: #f4f0e6; --red: #b82e32; --on-red: #f6f7f9;
    --red-soft: #f4e6e6; --grey: #dbe0e6; --hair: rgba(0,0,0,.18);
    --hair-soft: rgba(0,0,0,.09); --veil: rgba(255,255,255,.88); --ring-green: #226dc355;
    --ring-yellow: #b28c3444; --ring-red: #b82e3244; --ring-grey: #dbe0e644;
    --ring-ink: #28333e4d; --shadow-col: #2a3846; --wash-a: #f8f5ed;
    --wash-b: #eef2f7;
  }
  :root {
    --line: 4px;
    --pop: 6px 6px 0 var(--shadow-col);
    --pop-sm: 4px 4px 0 var(--shadow-col);
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0; overflow: hidden;
    background: var(--paper);
    background-image:
      radial-gradient(circle at 12% 8%, var(--wash-a) 0, transparent 42%),
      radial-gradient(circle at 88% 92%, var(--wash-b) 0, transparent 45%);
    color: var(--ink);
    font: 600 18px/1.45 ui-rounded, "Nunito", "Segoe UI Variable", system-ui, -apple-system, sans-serif;
    display: flex; flex-direction: column;
  }

  /* connection light — no words while everything is fine */
  #lamp {
    position: fixed; top: 16px; right: 18px; z-index: 5;
    width: 20px; height: 20px; border-radius: 50%;
    background: var(--green); border: 3px solid var(--ink);
    box-shadow: 0 0 0 4px var(--ring-green);
  }
  /* same lamp shape, one below the other — grey and quiet */
  #wipe {
    position: fixed; top: 49px; right: 18px; z-index: 5;
    display: grid; place-items: center; padding: 0;
    width: 20px; height: 20px; border-radius: 50%;
    font: 900 10px/1 inherit; color: var(--ink);
    background: var(--grey); border: 3px solid var(--ink);
    box-shadow: 0 0 0 4px var(--ring-grey);
    cursor: pointer; opacity: .6; transition: opacity .12s, background .12s;
  }
  #wipe:hover { opacity: 1; background: var(--yellow); color: var(--on-yellow); }
  /* third lamp in the same column: the timeline toggle */
  #tl-btn {
    position: fixed; top: 82px; right: 18px; z-index: 6;
    display: grid; place-items: center; padding: 0;
    width: 20px; height: 20px; border-radius: 50%;
    font: 900 11px/1 inherit; color: var(--on-yellow);
    background: var(--yellow); border: 3px solid var(--ink);
    box-shadow: 0 0 0 4px var(--ring-yellow);
    cursor: pointer; opacity: .75; transition: opacity .12s;
  }
  #tl-btn:hover, #tl-btn.on { opacity: 1; }
  /* open = the same yellow, ringed in ink, so the button never changes identity */
  #tl-btn.on { box-shadow: 0 0 0 4px var(--ring-ink); }

  /* fourth lamp: the palette picker */
  #pal-btn {
    position: fixed; top: 115px; right: 18px; z-index: 6;
    display: grid; place-items: center; padding: 0;
    width: 20px; height: 20px; border-radius: 50%;
    font: 900 11px/1 inherit; color: var(--on-yellow);
    background: var(--yellow); border: 3px solid var(--ink);
    box-shadow: 0 0 0 4px var(--ring-yellow);
    cursor: pointer; opacity: .75; transition: opacity .12s;
  }
  #pal-btn:hover, #pal-btn.on { opacity: 1; }
  #pal-btn.on { box-shadow: 0 0 0 4px var(--ring-ink); }
  #palette {
    display: none; position: fixed; top: 115px; right: 50px; z-index: 7;
    flex-direction: column; gap: 6px; padding: 10px;
    background: var(--panel); border: 3px solid var(--ink); box-shadow: var(--pop-sm);
  }
  #palette.open { display: flex; }
  #palette button {
    font: inherit; font-size: 15px; font-weight: 800; color: var(--ink); cursor: pointer;
    background: var(--paper); border: 3px solid var(--ink); border-radius: 10px;
    padding: 7px 14px; text-align: left; white-space: nowrap;
    display: flex; align-items: center; gap: 9px;
  }
  #palette button:hover { background: var(--yellow-soft); }
  #palette button[aria-checked="true"] { background: var(--green-soft); }
  #palette .chip {
    flex: none; width: 15px; height: 15px; border-radius: 50%; border: 2px solid var(--ink);
  }

  /* THE TIMELINE — hidden until T. Oldest left, newest right; it scrolls sideways only. */
  #timeline {
    display: none; flex: 0 0 auto; gap: 12px; overflow-x: auto; overflow-y: hidden;
    padding: 12px 56px 12px 22px; border-bottom: var(--line) dashed var(--hair);
    background: var(--veil);
  }
  #timeline.open { display: flex; }
  #timeline .empty-note { font-size: 15px; font-weight: 700; opacity: .5; }
  /* a session boundary: the strip is one ribbon, this says where a working session began */
  .tl-sep {
    flex: 0 0 auto; align-self: stretch; display: flex; flex-direction: column;
    justify-content: center; gap: 2px;
  }
  /* the divider line is its own element, so selecting a session can draw a full rim
     without the dashed border eating one side of it */
  .tl-rule { flex: 0 0 auto; align-self: stretch; border-left: 3px dashed var(--hair); }
  .tl-sep {
    width: 150px; text-align: left; font: inherit; color: var(--ink);
    background: none; border: 3px solid transparent; border-radius: 12px;
    padding: 6px 10px; margin-left: 4px;
  }
  .tl-sep b { font-size: 11px; font-weight: 900; letter-spacing: .06em; text-transform: uppercase; opacity: .75; }
  .tl-sep i { font-style: normal; font-size: 11px; font-weight: 700; line-height: 1.25; opacity: .6; }
  .tl-sep span { font-size: 10px; font-weight: 700; opacity: .45; font-family: ui-monospace, monospace; }
  .tl-sep.on b { opacity: 1; }
  .tl-sep.on { background: var(--yellow-soft); border-color: var(--ink); }
  .tl-sep.first { border-left: none; }
  /* every session in one menu, including ones with no replies in the strip */
  .tl-menu { flex: 0 0 auto; align-self: center; position: relative; }
  .tl-menu > button {
    font: inherit; font-size: 13px; font-weight: 800; text-transform: uppercase;
    letter-spacing: .04em; cursor: pointer; color: var(--ink);
    background: var(--panel); border: 3px solid var(--ink); border-radius: 999px; padding: 6px 14px;
    /* fixed, so the head of the strip does not jump when the session changes */
    width: 300px; text-align: left; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  /* ⚠️ the strip scrolls (overflow-x: auto), which CLIPS anything positioned inside it.
     The list is fixed and lives on <body>, so it floats over the whole page. */
  .tl-list {
    display: none; position: fixed; z-index: 60;
    flex-direction: column; gap: 6px; padding: 10px; max-height: 320px; overflow-y: auto;
    background: var(--panel); border: 3px solid var(--ink); box-shadow: var(--pop-sm);
    width: 620px; max-width: 86vw;
  }
  .tl-list.open { display: flex; }
  .tl-list button {
    font: inherit; font-size: 14px; font-weight: 700; text-align: left; cursor: pointer;
    color: var(--ink); background: var(--paper); border: 3px solid var(--ink);
    border-radius: 10px; padding: 7px 10px; display: flex; gap: 10px; align-items: baseline;
  }
  .tl-list button:hover { background: var(--yellow-soft); }
  .tl-list button.on { background: var(--green-soft); }
  .tl-list button.empty { opacity: .6; }
  .tl-list button em { font-style: normal; font-size: 11px; opacity: .5; font-family: ui-monospace, monospace; }
  .tl-list button span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; flex: 1; }


  /* a session with nothing in this log still opens: it says so, and says how to continue it */
  .tl-empty {
    flex: 0 0 auto; align-self: center; display: flex; flex-direction: column; gap: 5px;
    padding: 10px 14px; max-width: 620px;
    background: var(--panel); border: 3px dashed var(--hair); border-radius: 14px;
  }
  .tl-empty b { font-size: 14px; font-weight: 800; }
  .tl-empty span { font-size: 13px; opacity: .6; }
  .tl-empty code {
    font-family: ui-monospace, monospace; font-size: 13px; padding: 4px 8px;
    background: var(--yellow-soft); border: 2px solid var(--ink); border-radius: 8px;
    user-select: all;
  }
  .tl-empty i { font-style: normal; font-size: 12px; opacity: .55; }

  .thumb {
    flex: 0 0 auto; width: 150px; cursor: pointer; padding: 0; font: inherit; color: var(--ink);
    background: var(--panel); border: 3px solid var(--ink); box-shadow: var(--pop-sm);
    display: flex; flex-direction: column; text-align: left;
  }
  .thumb:hover, .thumb.on { background: var(--yellow-soft); }
  .thumb.pending { border-style: dashed; }
  .thumb.on { box-shadow: 0 0 0 var(--ink); transform: translate(4px, 4px); }
  /* the page itself, rendered at full width and scaled down -- a real screen, not a picture of one */
  .thumb .page {
    width: 100%; height: 86px; overflow: hidden; position: relative;
    border-bottom: 3px solid var(--ink); pointer-events: none;
  }
  .thumb .page > div {
    position: absolute; top: 0; left: 0; width: 760px;
    transform: scale(.197); transform-origin: top left;
    display: flex; flex-direction: column; gap: 16px;
  }
  .thumb .when {
    font-size: 11px; font-weight: 800; letter-spacing: .04em; padding: 4px 7px;
    display: flex; justify-content: space-between; gap: 6px;
  }
  .thumb .when i { font-style: normal; opacity: .55; }

  /* Claude's watch on the log is a separate thing from the server being up: the page
     can be perfectly connected while nothing is reading what you send. */
  /* It stands WHERE THE LAMP IS, and the lamp hides: a green "connected" beside a
     "not watching" is two answers to the same question. */
  #deaf {
    position: fixed; top: 10px; right: 14px; z-index: 7;
    font-size: 13px; font-weight: 900; letter-spacing: .03em; text-transform: uppercase;
    padding: 7px 14px; border: 3px solid var(--ink); border-radius: 999px;
    background: var(--red); color: var(--on-red); display: none;
    box-shadow: 0 0 0 4px var(--ring-red);
  }
  #lamp.hidden { display: none; }
  #deaf.on { display: block; }
  #deaf { cursor: pointer; font-family: inherit; box-shadow: var(--pop-sm); }
  #deaf:active { transform: translate(2px, 2px); box-shadow: none; }

  #lamp.off { background: var(--red); box-shadow: 0 0 0 4px var(--ring-red); animation: blink 1s steps(2) infinite; }
  @keyframes blink { 50% { opacity: .35; } }

  /* two columns: the decision on the left, whatever it opens on the right */
  #stage {
    flex: 1; overflow: hidden; display: grid; gap: 22px; padding: 22px 22px 12px;
    grid-template-columns: 1fr 1fr; align-items: stretch;
  }
  /* the left column shrinks to fit FIRST, and only scrolls once shrinking would make
     the text too small to read (the floor is in fit()) */
  /* ⚠️ align-items:center CLIPS THE TOP once the content is taller than the column:
     a centred flex item overflows in BOTH directions and the part above the start edge
     cannot be scrolled to. Auto margins centre the same way while it fits and collapse
     to zero when it does not, so the top stays reachable. */
  #left {
    overflow-y: auto; overflow-x: hidden;
    display: flex; flex-direction: column; align-items: center;
  }
  #fit { width: 100%; max-width: 760px; margin: auto 0; }
  /* the right one MAY scroll: detail is not a decision and does not have to fit a screen */
  #detail {
    /* the four corner buttons are FIXED, so anything scrolling past would pass under
       them; the right gutter keeps text clear of all four */
    overflow-y: auto; border-left: var(--line) dashed var(--hair); padding: 4px 56px 4px 22px;
    display: flex; flex-direction: column; gap: 16px;
  }
  #detail.empty { align-items: center; justify-content: center; border-left-color: var(--hair-soft); }
  /* A scrollable surface says so: the overlay bar the OS draws is invisible until you
     already scrolled, which is too late to tell you there is more below. */
  #left, #detail { scrollbar-width: thin; scrollbar-color: var(--ink) transparent; }
  /* the strip and the session menu share one scrollbar style */
  #timeline, .tl-list { scrollbar-width: auto; scrollbar-color: var(--ink) var(--panel); }
  #left::-webkit-scrollbar, #detail::-webkit-scrollbar,
  #timeline::-webkit-scrollbar, .tl-list::-webkit-scrollbar { width: 14px; height: 14px; }
  #left::-webkit-scrollbar-track, #detail::-webkit-scrollbar-track,
  #timeline::-webkit-scrollbar-track, .tl-list::-webkit-scrollbar-track { background: var(--panel); }
  #left::-webkit-scrollbar-thumb, #detail::-webkit-scrollbar-thumb,
  #timeline::-webkit-scrollbar-thumb, .tl-list::-webkit-scrollbar-thumb {
    background: var(--ink); border: 3px solid var(--paper); border-radius: 999px;
  }
  #detail .placeholder {
    font-size: 15px; font-weight: 700; letter-spacing: .04em; text-transform: uppercase;
    opacity: .32; text-align: center; max-width: 26ch; line-height: 1.6;
  }
  #detail h2 {
    margin: 0; font-size: 25px; font-weight: 900; letter-spacing: -.02em; line-height: 1.15;
  }
  .cards button.on { background: var(--yellow); color: var(--on-yellow); box-shadow: 0 0 0 var(--ink); transform: translate(4px, 4px); }
  @media (max-width: 900px) {
    #stage { grid-template-columns: 1fr; grid-template-rows: 1fr auto; }
    #detail { border-left: none; border-top: var(--line) dashed var(--hair); padding: 16px 56px 4px 4px; max-height: 45%; }
  }
  #screen {
    width: 100%; transform-origin: top left;
    display: flex; flex-direction: column; gap: 16px;
  }
  #screen.pop { animation: pop .26s cubic-bezier(.2,.9,.3,1.2); }
  @keyframes pop { from { opacity: 0; } }

  .crumb {
    align-self: flex-start; font-size: 15px; font-weight: 700;
    background: var(--panel); border: 3px solid var(--ink); border-radius: 999px;
    padding: 5px 15px;
    max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  /* one row: what you asked on the left, when this answer landed on the right */
  .head { display: flex; align-items: flex-start; gap: 12px; justify-content: space-between; }
  /* The slot holds the row's height; the crumb floats inside it, so unfolding grows
     DOWNWARD over the reply instead of pushing everything below it further down. */
  .head .slot { position: relative; flex: 1 1 auto; min-width: 0; height: 38px; }
  .head .crumb { position: absolute; top: 0; left: 0; max-width: 100%; z-index: 20; }
  /* the stamp holds its own slot too, so showing the date grows DOWNWARD over the
     reply and nothing below it moves. No rim: it is a label, not a control. */
  .head .stamp-slot { position: relative; flex: none; height: 38px; width: 84px; }
  .stamp {
    position: absolute; top: 7px; right: 0; text-align: right;
    font-size: 15px; font-weight: 800; letter-spacing: .02em;
    opacity: .55; cursor: default; font-variant-numeric: tabular-nums; z-index: 20;
  }
  .stamp .date { display: none; }        /* same font as the hour; it only appears */
  /* no darkening on hover -- it is a label; only the date appears */
  .stamp:hover .date, .stamp.open .date { display: block; }
  .crumb::before { content: "YOU SAID: "; font-size: 12px; letter-spacing: .05em; opacity: .55; }
  /* a long command is cut to one line and opens on hover or click -- no tooltip, the
     hover already shows the whole thing */
  .crumb { cursor: pointer; }
  .crumb:hover, .crumb.open {
    white-space: normal; overflow: visible; border-radius: 18px;
    background: var(--yellow-soft); box-shadow: var(--pop-sm);
  }

  .badge {
    align-self: flex-start; font-size: 17px; font-weight: 800; letter-spacing: .01em;
    padding: 9px 18px; border: 3px solid var(--ink); border-radius: 999px;
    text-transform: uppercase;
  }
  .badge.ok { background: var(--green); color: var(--on-green); }
  .badge.warn { background: var(--yellow); color: var(--on-yellow); }
  .badge.err { background: var(--red); color: var(--on-red); }
  .badge.wait { background: var(--panel); text-transform: none; }

  .ask {
    margin: 0; font-size: clamp(30px, 5vw, 46px); line-height: 1.08;
    font-weight: 900; letter-spacing: -.03em;
  }
  .say { margin: 0; font-size: clamp(19px, 2.3vw, 23px); line-height: 1.4; font-weight: 650; }
  .note { margin: 0; font-size: 16px; font-weight: 600; opacity: .7; }
  .plain { margin: 0; font-size: 18px; white-space: pre-wrap; }

  .stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(215px, 1fr)); gap: 12px; }
  .stat {
    background: var(--yellow-soft); border: 3px solid var(--ink);
    border-radius: 14px; padding: 13px 16px;
  }
  .stat b {
    display: block; font-size: 13px; font-weight: 800; letter-spacing: .06em;
    text-transform: uppercase; opacity: .6; margin-bottom: 3px;
  }
  .stat span { font-size: 24px; font-weight: 900; letter-spacing: -.02em; }

  /* A chart is a stat that moved: same card, same ink, one line of data. */
  .chart {
    background: var(--panel); border: 3px solid var(--ink);
    border-radius: 14px; padding: 13px 16px;
  }
  .chart b {
    display: block; font-size: 13px; font-weight: 800; letter-spacing: .06em;
    text-transform: uppercase; opacity: .6; margin-bottom: 6px;
  }
  .chart svg { display: block; width: 100%; height: auto; }
  .chart .foot {
    display: flex; justify-content: space-between;
    font-size: 13px; font-weight: 800; opacity: .6; margin-top: 4px;
  }
  .chart .foot .now { opacity: 1; color: var(--green-deep); }

  /* ::html — a raw fragment. It gets the panel's type and a readable table by default. */
  .raw { font-size: 16px; }
  .raw table { border-collapse: collapse; width: 100%; font-variant-numeric: tabular-nums; }
  .raw th, .raw td { border: 2px solid var(--ink); padding: 6px 10px; text-align: left; }
  .raw th { background: var(--yellow-soft); font-size: 13px; letter-spacing: .05em; text-transform: uppercase; }
  .raw img, .raw svg { max-width: 100%; height: auto; }

  /* two across on any reasonable width, one across on a narrow pane */
  .cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(190px, 1fr)); gap: 12px; }
  .cards button {
    text-align: left; font: inherit; cursor: pointer; color: var(--ink);
    background: var(--yellow-soft); border: var(--line) solid var(--ink);
    box-shadow: var(--pop-sm); padding: 14px 15px 12px; border-radius: 0;
    display: flex; flex-direction: column; gap: 8px; min-height: 96px;
  }
  .cards button:hover { background: var(--yellow); color: var(--on-yellow); }
  .cards button:active { transform: translate(4px, 4px); box-shadow: 0 0 0 var(--ink); }
  .cards button b { font-size: 17px; font-weight: 800; line-height: 1.25; letter-spacing: -.01em; }
  .cards button .more {
    margin-top: auto; font-size: 11px; font-weight: 700; letter-spacing: .1em;
    text-transform: uppercase; opacity: .6;
  }
  /* progress notes under "Working on it…" — scaffolding, so it stays quiet */
  .progress { display: flex; flex-direction: column; gap: 6px; margin-top: 4px; }
  .progress .step {
    display: flex; gap: 10px; align-items: baseline;
    font-size: 16px; font-weight: 650; opacity: .55;
  }
  .progress .step b { font-size: 13px; opacity: .8; }
  .progress .step.now { opacity: 1; font-weight: 800; }

  .picks {
    display: grid; gap: 14px; margin-top: 4px;
    /* the buttons cast a 6px offset shadow; without room under the last row it is
       clipped by the column and the thick rim looks cut off */
    margin-bottom: 10px;
    grid-template-columns: repeat(auto-fit, minmax(270px, 1fr));
  }
  .picks button {
    display: flex; align-items: center; gap: 14px; text-align: left; width: 100%;
    min-height: 104px; font: inherit; font-size: 19px; font-weight: 800; color: var(--ink);
    line-height: 1.22;
    background: var(--green-soft); border: var(--line) solid var(--ink);
    border-radius: 20px; padding: 16px 18px; cursor: pointer; box-shadow: var(--pop);
    transition: transform .08s, box-shadow .08s, background .12s;
  }
  .picks button:hover { background: var(--green); color: var(--on-green); }
  .picks button:disabled {
    cursor: default; opacity: .55; box-shadow: var(--pop-sm);
    background: var(--panel);
  }
  .picks button:disabled:hover { background: var(--panel); color: var(--ink); }
  .picks button:active { transform: translate(6px, 6px); box-shadow: 0 0 0 var(--ink); }
  .picks button kbd {
    flex: none; display: grid; place-items: center; width: 44px; height: 44px;
    font: 900 20px/1 inherit; background: var(--yellow); color: var(--on-yellow);
    border: 3px solid var(--ink); border-radius: 50%;
  }
  .picks button.fill { background: var(--panel); }


  .thinking {
    display: flex; align-items: center; gap: 14px; font-size: 22px; font-weight: 800;
    background: var(--panel); border: var(--line) solid var(--ink);
    border-radius: 20px; padding: 20px 24px; box-shadow: var(--pop);
  }
  .thinking i {
    width: 16px; height: 16px; border-radius: 50%;
    background: var(--green); border: 3px solid var(--ink); animation: bounce 1s infinite;
  }
  .thinking i:nth-child(2) { animation-delay: .15s; background: var(--yellow); }
  .thinking i:nth-child(3) { animation-delay: .3s; }
  @keyframes bounce { 0%, 70%, 100% { transform: translateY(0); } 35% { transform: translateY(-9px); } }

  .fixit {
    background: var(--red-soft); border: var(--line) solid var(--ink);
    border-radius: 22px; padding: 24px; box-shadow: var(--pop);
    display: flex; flex-direction: column; gap: 14px;
  }
  .fixit h1 { margin: 0; font-size: 34px; font-weight: 900; letter-spacing: -.02em; }
  .fixit p { margin: 0; font-size: 19px; font-weight: 650; }
  .fixit code {
    display: block; font: 700 18px/1.5 ui-monospace, Menlo, Consolas, monospace;
    background: var(--panel); border: 3px solid var(--ink); border-radius: 14px;
    padding: 13px 16px; word-break: break-all;
  }

  footer { flex: none; padding: 10px 22px 18px; border-top: var(--line) solid var(--ink); background: var(--paper); }
  form { width: 100%; margin: 0; display: flex; gap: 12px; align-items: flex-end; }
  textarea {
    flex: 1; resize: none; font: inherit; font-size: 19px; font-weight: 650; color: var(--ink);
    background: var(--panel); border: var(--line) solid var(--ink);
    border-radius: 18px; padding: 16px 18px; min-height: 104px; max-height: 220px;
    box-shadow: var(--pop-sm);
  }
  textarea::placeholder { color: var(--ink); opacity: .4; }
  textarea:focus { outline: none; background: var(--yellow-soft); }
  #compose { flex: 1; display: flex; flex-direction: column; gap: 6px; min-width: 0; }
  #to-wrap {
    display: none; align-items: center; gap: 8px;
    font-size: 13px; font-weight: 800; letter-spacing: .05em; text-transform: uppercase; opacity: .7;
  }
  #to-wrap.on { display: flex; }
  #to-hint {
    display: none; font-size: 13px; font-weight: 800; letter-spacing: .03em;
    text-transform: uppercase; opacity: .7;
  }
  #to-hint.on { display: block; }
  #to-hint.dead { color: var(--red); opacity: 1; }
  #to {
    font: inherit; font-size: 14px; font-weight: 700; color: var(--ink);
    background: var(--panel); border: 3px solid var(--ink); border-radius: 10px;
    padding: 4px 8px; max-width: 60%;
  }

  form button {
    font: inherit; font-size: 20px; font-weight: 900; height: 104px; padding: 0 34px;
    background: var(--yellow); color: var(--on-yellow);
    border: var(--line) solid var(--ink); border-radius: 18px; cursor: pointer;
    box-shadow: var(--pop-sm); transition: transform .08s, box-shadow .08s;
  }
  form button:active { transform: translate(4px, 4px); box-shadow: 0 0 0 var(--ink); }
</style>
</head>
<body>
  <button id="wipe" type="button" title="Clear the screen">✕</button>
  <button id="tl-btn" type="button" title="Timeline — past replies">T</button>
  <button id="pal-btn" type="button" title="Colour palette">C</button>
  <div id="palette" role="radiogroup" aria-label="Colour palette"></div>
  <div id="lamp" title="Connected"></div>
  <button id="deaf" type="button" title="Nobody is reading the log — click to see what to do">not watching</button>
  <div id="timeline"></div>
  <div id="stage">
    <div id="left"><div id="fit"><div id="screen"></div></div></div>
    <div id="detail" class="empty"></div>
  </div>
  <footer>
    <form id="form">
      <div id="compose">
        <textarea id="input" rows="3" placeholder="Type here…" autofocus></textarea>
        <label id="to-wrap" for="to"><span>to</span>
          <select id="to"><option value="">whoever is listening</option></select>
        </label>
        <div id="to-hint"></div>
      </div>
      <button type="submit">SEND</button>
    </form>
  </footer>

<script>
  const detail = document.getElementById('detail');
  const fitBox = document.getElementById('fit');
  const screenEl = document.getElementById('screen');
  const input = document.getElementById('input');
  const form  = document.getElementById('form');
  const lamp  = document.getElementById('lamp');
  const toSel = document.getElementById('to');
  const toWrap = document.getElementById('to-wrap');
  const toHint = document.getElementById('to-hint');
  const deaf  = document.getElementById('deaf');
  let since = 0, fails = 0, offline = false, lastCommand = '';
  let waitingNow = false, lastStatusSig = '', lastWatchAge = null, lastWatcherSig = '';
  // every question asked since the last reply, in order: several messages in a row are
  // all answered by the one reply that follows, so the breadcrumb has to carry them all
  let pendingAsk = [];
  const JOIN = '  /  ';
  const BUILD = "__BUILD__";  // server stamps chat.html's mtime here at serve time

  const el = (tag, cls, text) => {
    const n = document.createElement(tag);
    if (cls) n.className = cls;
    if (text !== undefined) n.textContent = text;
    return n;
  };

  /** Shrink the card until it fits the stage, but not past MIN_SCALE — below that the
      text stops being readable from across the room, which is the whole point of this
      panel, so the column scrolls instead. */
  const MIN_SCALE = 0.8;
  function fit() {
    screenEl.style.transform = 'none';
    screenEl.style.width = '100%';
    fitBox.style.height = 'auto';
    if (!screenEl.children.length) return;

    const avail = document.getElementById('left').clientHeight - 12;
    let k = Math.min(1, avail / screenEl.scrollHeight);
    if (k < 1) {
      // widen first so text reflows, then re-measure: a wider box is a shorter box
      screenEl.style.width = (100 / k) + '%';
      k = Math.min(1, Math.max(avail / screenEl.scrollHeight, MIN_SCALE));
      screenEl.style.width = (100 / k) + '%';
      screenEl.style.transform = 'scale(' + k + ')';
    }
    fitBox.style.height = Math.ceil(screenEl.scrollHeight * k) + 'px';
  }

  /** Swap the whole screen — this console never keeps history. */
  /** (HH:MM) from the reply's own timestamp, with the date on hover. The panel stamps
      every reply, so a reply never has to carry the clock in its own text. */
  function stampOf(ts) {
    if (!ts) return null;
    const st = el('div', 'stamp');
    st.append(el('div', '', '(' + clock(ts) + ')'));
    const d = (ts || '').slice(0, 10).split('-');     // 2026-09-24 -> 24.09.2026
    if (d.length === 3) st.append(el('div', 'date', d[2] + '.' + d[1] + '.' + d[0]));
    st.onclick = () => st.classList.toggle('open');
    const slot = el('div', 'stamp-slot');
    slot.append(st);
    return slot;
  }

  function show(nodes, crumb = true, ts = null) {
    closeSheet();          // a new reply invalidates whatever detail was open
    // ...and it invalidates a held live screen: what was held is no longer live
    held = null; pinned = null;
    const kids = [];
    const stamp = stampOf(ts);
    if ((crumb && lastCommand) || stamp) {
      const head = el('div', 'head');
      if (crumb && lastCommand) {
        const c = el('div', 'crumb', lastCommand);
        c.onclick = () => c.classList.toggle('open');   // no fit(): the row keeps its height
        const slot = el('div', 'slot');
        slot.append(c);
        head.append(slot);
      }
      if (stamp) head.append(stamp);
      kids.push(head);
    }
    kids.push(...nodes);
    screenEl.classList.remove('pop');
    screenEl.replaceChildren(...kids);
    void screenEl.offsetWidth;      // restart the entrance animation
    screenEl.classList.add('pop');
    fit();
  }

  function parse(text) {
    const blocks = [];
    for (const raw of text.split('\n')) {
      const line = raw.trim();
      if (!line) continue;
      const m = line.match(/^::(\w+)\s*(.*)$/);
      blocks.push(m ? { type: m[1].toLowerCase(), body: m[2] } : { type: 'plain', body: line });
    }
    return blocks;
  }

  function build(text) { return buildBlocks(parse(text)); }

  const SVGNS = 'http://www.w3.org/2000/svg';
  function svg(tag, attrs) {
    const n = document.createElementNS(SVGNS, tag);
    for (const k in attrs) n.setAttribute(k, attrs[k]);
    return n;
  }

  /** ::chart <title> = v1,v2,v3 — one line, scaled to its own min/max, last point marked.
      The y axis is the series' own range, so a flat line means flat, not zoomed-out. */
  function chart(body) {
    const cut = body.indexOf('=');
    const title = (cut < 0 ? body : body.slice(0, cut)).trim();
    const vals = (cut < 0 ? '' : body.slice(cut + 1))
      .split(',').map(s => parseFloat(s)).filter(v => isFinite(v));
    const box = el('div', 'chart');
    box.append(el('b', '', title));
    if (vals.length < 2) { box.append(el('p', 'note', 'no data')); return box; }

    const W = 600, H = 150, PAD = 8;
    const lo = Math.min(...vals), hi = Math.max(...vals);
    const span = hi - lo || 1;
    const x = i => PAD + i * (W - 2 * PAD) / (vals.length - 1);
    const y = v => H - PAD - (v - lo) / span * (H - 2 * PAD);

    const s = svg('svg', { viewBox: `0 0 ${W} ${H}`, role: 'img', 'aria-label': title });
    s.append(svg('polyline', {
      points: vals.map((v, i) => `${x(i).toFixed(1)},${y(v).toFixed(1)}`).join(' '),
      fill: 'none', stroke: 'var(--green-deep)', 'stroke-width': 4,
      'stroke-linejoin': 'round', 'stroke-linecap': 'round',
    }));
    s.append(svg('circle', {
      cx: x(vals.length - 1), cy: y(vals[vals.length - 1]), r: 7,
      fill: 'var(--yellow)', stroke: 'var(--ink)', 'stroke-width': 3,
    }));
    box.append(s);

    // left = where it started, right = where it is now, middle = the range the line is drawn in,
    // so a reader can tell a real fall from an autoscaled wiggle
    const foot = el('div', 'foot');
    foot.append(el('span', '', String(vals[0])),
                el('span', '', `${lo} – ${hi}`),
                el('span', 'now', String(vals[vals.length - 1])));
    box.append(foot);
    return box;
  }

  /** ::html <fragment>, or ::html … ::endhtml for several lines — injected as real HTML.
      The escape hatch for anything the markup has no directive for: a table, a second
      chart shape, an <img>. Only replies written by this side reach here; a user message
      is shown as the crumb's textContent and is never parsed as markup. */
  function rawHtml(source) {
    const box = el('div', 'raw');
    box.innerHTML = source;
    return box;
  }

  /** Render parsed blocks. Called again for each ::card body, so windows nest naturally. */
  function buildBlocks(blocks) {
    const nodes = [];
    let picks = null, stats = null, cards = null;

    for (let i = 0; i < blocks.length; i++) {
      const b = blocks[i];
      if (b.type === 'card') {
        picks = null; stats = null;
        // collect to the matching ::endcard, counting nested ::card so inner windows survive
        const inner = [];
        let depth = 1;
        while (++i < blocks.length) {
          if (blocks[i].type === 'card') depth++;
          if (blocks[i].type === 'endcard' && --depth === 0) break;
          inner.push(blocks[i]);
        }
        if (!cards) { cards = el('div', 'cards'); nodes.push(cards); }
        const tile = el('button');
        tile.type = 'button';
        tile.append(el('b', '', b.body), el('span', 'more', 'open ▸'));
        tile.onclick = () => openSheet(b.body, inner, tile);
        cards.append(tile);
        continue;
      }
      if (b.type === 'endcard') continue;
      cards = null;
      if (b.type === 'pick' || b.type === 'fill') {
        stats = null;
        if (!picks) { picks = el('div', 'picks'); nodes.push(picks); }
        const isFill = b.type === 'fill';
        const [label, cmd] = b.body.split('=>').map(s => s.trim());
        const btn = el('button', isFill ? 'fill' : '');
        btn.type = 'button';
        btn.dataset.cmd = cmd || label;
        btn.append(el('kbd', '', isFill ? '✎' : String(picks.children.length + 1)));
        btn.append(el('span', '', label));
        // a prefill is the START of a sentence, so it ends with a space and the caret
        // sits after it -- the point is to keep typing, not to edit what landed
        if (btn.dataset.cmd === '__reload') {
          btn.onclick = () => location.reload();
          picks.append(btn);
          continue;
        }
        btn.onclick = () => isFill
          ? (input.value = btn.dataset.cmd + ' ',
             input.focus(),
             input.setSelectionRange(input.value.length, input.value.length))
          : send(btn.dataset.cmd);
        picks.append(btn);
        continue;
      }
      if (b.type === 'kv') {
        picks = null;
        if (!stats) { stats = el('div', 'stats'); nodes.push(stats); }
        const [k, ...rest] = b.body.split('=');
        const box = el('div', 'stat');
        box.append(el('b', '', (k || '').trim()), el('span', '', rest.join('=').trim()));
        stats.append(box);
        continue;
      }
      picks = null; stats = null;
      if (b.type === 'chart') { nodes.push(chart(b.body)); continue; }
      if (b.type === 'html') {
        // `::html <fragment>` is ONE line and consumes nothing after it; only a bare
        // `::html` opens a block, which runs to ::endhtml. Consuming after a one-liner
        // silently ate the next directive -- a reply lost its closing line to it.
        if (b.body) { nodes.push(rawHtml(b.body)); continue; }
        const parts = [];
        while (i + 1 < blocks.length && blocks[i + 1].type !== 'endhtml') {
          parts.push(blocks[++i].body);
        }
        i++;                                   // step over ::endhtml (or off the end)
        nodes.push(rawHtml(parts.join('\n')));
        continue;
      }
      if (b.type === 'endhtml') continue;
      switch (b.type) {
        case 'ask':  nodes.push(el('h1', 'ask', b.body)); break;
        case 'say':  nodes.push(el('p', 'say', b.body)); break;
        case 'note': nodes.push(el('p', 'note', b.body)); break;
        case 'ok': case 'warn': case 'err':
          nodes.push(el('div', 'badge ' + b.type, b.body)); break;
        case 'wait': nodes.push(el('div', 'badge wait', b.body)); break;
        default: nodes.push(el('p', 'plain', b.body));
      }
    }
    return nodes;
  }

  /* The right pane is the detail surface: empty until something on the left is chosen,
     and it may scroll, because detail is not a decision and need not fit one screen. */
  let sheet = null;                       // the pane when it holds something, else null
  function closeSheet() {
    detail.replaceChildren(el('p', 'placeholder', 'Pick something on the left'));
    detail.classList.add('empty');
    screenEl.querySelectorAll('.cards button.on').forEach(b => b.classList.remove('on'));
    sheet = null;
  }
  function openSheet(title, blocks, tile) {
    detail.classList.remove('empty');
    detail.replaceChildren(el('h2', '', title), ...buildBlocks(blocks));
    detail.scrollTop = 0;
    screenEl.querySelectorAll('.cards button.on').forEach(b => b.classList.remove('on'));
    if (tile) tile.classList.add('on');
    sheet = detail;
  }

  /** The "to:" list is the sessions with a LIVE watch. One watcher is the normal case and
      needs no choice, so the control only appears once there are two. */
  // the chosen session survives a reload, like the palette: losing it silently is how a
  // message ends up somewhere you did not mean
  let target = (() => { try { return localStorage.getItem('ctrl-to') || ''; } catch { return ''; } })();
  let aliveIds = [];

  function drawTarget() {
    try { target ? localStorage.setItem('ctrl-to', target) : localStorage.removeItem('ctrl-to'); } catch {}
    toSel.value = target;
    const name = tlNames[target] || target;
    const alive = !target || aliveIds.includes(target);
    toHint.textContent = !target ? ''
      : (alive ? 'talking to: ' + name.slice(0, 40)
               : 'NOT RUNNING — ' + name.slice(0, 32) + ' · claude --resume ' + target.slice(0, 8));
    toHint.classList.toggle('on', !!target);
    toHint.classList.toggle('dead', !!target && !alive);
  }

  function drawWatchers(list) {
    aliveIds = list.map(w => w.session);
    const sig = list.map(w => w.session).join(',');
    if (sig !== lastWatcherSig) {
      lastWatcherSig = sig;
      const keep = toSel.value;
      // ⛔ an <option> with no value attribute uses its TEXT as its value, so this one
      // was sending to="whoever is listening" -- a target no watcher matches, which
      // watch.py then filtered out. Every message picked that way went nowhere.
      const any = el('option', '', 'whoever is listening');
      any.value = '';
      toSel.replaceChildren(any);
      list.forEach(w => {
        const o = el('option', '', (w.label || w.session).slice(0, 48));
        o.value = w.session;
        toSel.append(o);
      });
      if ([...toSel.options].some(o => o.value === keep)) toSel.value = keep;
    }
    toWrap.classList.toggle('on', list.length > 1 || !!target);
    drawTarget();
  }

  function waiting(status) {
    waitingNow = true;
    const box = el('div', 'thinking');
    box.append(el('i'), el('i'), el('i'), el('span', '', 'Working on it…'));
    const kids = [box];
    if (status && status.length) {
      // newest last, the way a log reads; the last line is the one happening now
      const log = el('div', 'progress');
      status.forEach((line, i) => {
        const row = el('div', 'step' + (i === status.length - 1 ? ' now' : ''));
        row.append(el('b', '', i === status.length - 1 ? '▸' : '·'), el('span', '', line));
        log.append(row);
      });
      kids.push(log);
    }
    show(kids);
  }

  /** The only time words appear about the connection: when it is broken. */
  function showOffline() {
    const card = el('div', 'fixit');
    card.append(
      el('h1', '', 'The panel is switched off'),
      el('p', '', 'The little program that runs this page has stopped. Open the terminal and type this:'),
      el('code', '', 'python3 chat_server.py'),
      el('p', '', 'This page turns itself back on within a second. Nothing is lost.'),
    );
    show([card], false);
  }

  async function send(text) {
    text = (text || '').trim();
    if (!text) return true;
    lastCommand = text;
    waiting();
    try {
      await fetch('/api/send', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ text, to: target || toSel.value || '' }),
      });
      poll();
      return true;
    } catch {
      showOffline();
      return false;
    }
  }

  async function poll() {
    try {
      const res = await fetch('/api/messages?since=' + since + '&v=' + BUILD, { cache: 'no-store' });
      const data = await res.json();
      if (data.build && BUILD !== "__BUILD__" && data.build !== BUILD) return location.reload();

      fails = 0;
      lamp.classList.remove('off');
      lamp.title = 'Connected';
      // the watcher touches .watch every 30s; 3 missed beats means the watch is gone
      lastWatchAge = data.watch;
      drawWatchers(data.watchers || []);
      const dead = lastWatchAge === null || lastWatchAge === undefined || lastWatchAge > 90;
      deaf.classList.toggle('on', dead);
      lamp.classList.toggle('hidden', dead);    // one light, one answer
      if (offline) { offline = false; since = 0; return; }  // redraw from history next tick
      // progress lines move while NO new message arrives, so they are their own redraw
      if (!data.messages.length) {
        const sig = (data.status || []).join('\u0001');
        if (waitingNow && sig !== lastStatusSig) { lastStatusSig = sig; waiting(data.status); }
        return;
      }
      lastStatusSig = (data.status || []).join('\u0001');
      since = data.last;

      // Walk the batch in order: questions pile up until a reply answers them all.
      for (const m of data.messages) {
        if (m.role === 'user') pendingAsk.push(m.text);
        else { if (pendingAsk.length) lastCommand = pendingAsk.join(JOIN); pendingAsk = []; }
      }

      // A command with no answer yet must keep showing "working" — never fall
      // back to the previous card, which reads as "nothing happened".
      const newest = data.messages[data.messages.length - 1];
      if (newest.role === 'user') {
        lastCommand = pendingAsk.join(JOIN);
        waiting(data.status);
        return;
      }
      waitingNow = false;
      show(build(newest.text), true, newest.ts);
    } catch {
      lamp.classList.add('off');
      lamp.title = 'Disconnected — the server is not answering';
      if (++fails >= 2 && !offline) { offline = true; showOffline(); }
    }
  }

  form.addEventListener('submit', async (e) => {
    e.preventDefault();
    const text = input.value;
    input.value = ''; input.style.height = 'auto';
    if (await send(text) === false) input.value = text;
  });

  input.addEventListener('keydown', (e) => {
    if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); form.requestSubmit(); }
  });
  input.addEventListener('input', () => {
    input.style.height = 'auto';
    input.style.height = Math.min(input.scrollHeight, 150) + 'px';
    fit();  // a taller composer leaves less room for the card
  });

  window.addEventListener('resize', fit);
  document.addEventListener('click', (e) => {
    if (menuList && !e.target.closest('.tl-menu') && !e.target.closest('.tl-menu .list')
        && !menuList.contains(e.target)) closeSessionMenu();
  }, true);

  /* ---- PALETTE -------------------------------------------------------------
     Three token sets in the stylesheet; this only stamps data-theme on <html> and
     remembers the choice. Dark is the default, so an empty stamp is already right —
     the read is wrapped because localStorage throws in a locked-down browser. ---- */
  const THEMES = [
    { id: 'dark',  name: 'Dark mode',      chip: '#1f1f1f' },
    { id: 'light', name: 'Light mode',     chip: '#ffffff' },
    { id: 'peas',  name: 'Peas with corn', chip: '#ffd43b' },
    { id: 'cobalt',     name: 'Copper & Cobalt', chip: '#4987df' },
    { id: 'plum',       name: 'Plum & Citron',   chip: '#9949df' },
    { id: 'terracotta', name: 'Terracotta Triad', chip: '#c96a3e' },
    { id: 'moss',       name: 'Moss',            chip: '#49df99' },
    { id: 'porcelain',  name: 'Porcelain & Ink', chip: '#226dc3' },
  ];
  const palBtn = document.getElementById('pal-btn');
  const palEl = document.getElementById('palette');

  function applyTheme(id) {
    document.documentElement.dataset.theme = id;
    try { localStorage.setItem('ctrl-theme', id); } catch {}
    palEl.querySelectorAll('button').forEach(b =>
      b.setAttribute('aria-checked', String(b.dataset.id === id)));
  }

  THEMES.forEach(t => {
    const b = el('button');
    b.type = 'button';
    b.dataset.id = t.id;
    b.setAttribute('role', 'radio');
    const chip = el('span', 'chip');
    chip.style.background = t.chip;
    b.append(chip, el('span', '', t.name));
    b.onclick = () => { applyTheme(t.id); palEl.classList.remove('open'); palBtn.classList.remove('on'); };
    palEl.append(b);
  });

  toSel.onchange = () => { target = toSel.value || ''; drawTarget(); };

  palBtn.onclick = () => {
    const open = palEl.classList.toggle('open');
    palBtn.classList.toggle('on', open);
  };
  applyTheme(document.documentElement.dataset.theme || 'peas');

  /* ---- TIMELINE ------------------------------------------------------------
     Past replies, re-rendered by the same builder rather than stored as pictures,
     so an old screen shows exactly what it showed then. Hovering one puts it in the
     left column; the live screen is held aside and put back on the way out. A click
     pins it, so you can open its cards. ------------------------------------------ */
  const tlEl = document.getElementById('timeline');
  let tlFilter = null, tlRows = [], tlNames = {};
  const tlBtn = document.getElementById('tl-btn');
  let tlOpen = false, held = null, pinned = null;

  const clock = (ts) => (ts || '').slice(11, 16);

  function holdLive() { if (!held) held = [...screenEl.children]; }
  function restoreLive() {
    if (!held) return;
    screenEl.replaceChildren(...held);
    held = null;
    fit();
  }
  function markThumb(btn) {
    tlEl.querySelectorAll('.thumb.on').forEach(t => t.classList.remove('on'));
    if (btn) btn.classList.add('on');
  }
  /** An archived screen is shown the way it was: the question that produced it in the
      breadcrumb, its own time on the right. msg.asked is paired in openTimeline. */
  function showArchived(msg) {
    holdLive();
    closeSheet();
    const head = el('div', 'head');
    if (msg.asked) {
      const c = el('div', 'crumb', msg.asked);
      c.onclick = () => c.classList.toggle('open');
      const slot = el('div', 'slot');
      slot.append(c);
      head.append(slot);
    }
    const st = stampOf(msg.ts);
    if (st) head.append(st);
    const kids = build(msg.text);
    if (head.children.length) kids.unshift(head);
    screenEl.replaceChildren(...kids);
    // ⛔ an archived reply is a RECORD. Its choice buttons still carried live onclicks,
    // so reading yesterday's screen could SEND yesterday's command. Cards stay usable --
    // they only open the right pane -- everything that would post is disabled.
    screenEl.querySelectorAll('.picks button').forEach(b => {
      b.disabled = true;
      b.title = 'from an earlier reply — not live';
    });
    fit();
  }

  function thumbOf(msg, n) {
    const btn = el('button', 'thumb');
    btn.type = 'button';
    btn.title = (msg.asked ? msg.asked + '\n\n' : '') + 'hover to read, click to pin';
    const page = el('div', 'page');
    const inner = el('div');
    // the thumbnail is the screen as it was, breadcrumb included, so a reply can be
    // recognised by what was ASKED rather than by the shape of its answer
    if (msg.asked) inner.append(el('div', 'crumb', msg.asked));
    inner.append(...build(msg.text));
    // belt and braces with .page's pointer-events: inert takes it out of the tab order
    // and out of hit-testing entirely, so a nested button cannot be reached at all
    inner.inert = true;
    page.append(inner);
    const when = el('div', 'when');
    when.append(el('span', '', clock(msg.ts)), el('i', '', '#' + n));
    btn.append(page, when);

    if (msg.pending) btn.classList.add('pending');
    btn.onmouseenter = () => { if (!pinned) { showArchived(msg); markThumb(btn); } };
    btn.onmouseleave = () => { if (!pinned) { restoreLive(); markThumb(null); } };
    btn.onclick = () => {
      if (pinned === msg) { pinned = null; restoreLive(); markThumb(null); return; }
      pinned = msg; showArchived(msg); markThumb(btn);
    };
    return btn;
  }

  async function openTimeline() {
    tlOpen = true;
    tlEl.classList.add('open');
    tlBtn.classList.add('on');
    tlEl.replaceChildren(el('p', 'empty-note', 'loading…'));
    let msgs;
    try {
      msgs = (await (await fetch('/api/messages?since=0', { cache: 'no-store' })).json()).messages || [];
    } catch {
      return tlEl.replaceChildren(el('p', 'empty-note', 'offline — cannot read the log'));
    }
    // pair each reply with the question before it -- the log is one flat list, and a
    // reply on its own cannot say what it was answering
    const replies = [];
    let asked = [];
    for (const m of msgs) {
      if (m.role === 'user') {
        asked.push(m.text);
        // a question ADDRESSED to a session belongs in that session's strip, answered
        // or not -- otherwise choosing a session and writing to it shows nothing
        if (m.to) replies.push({ ...m, session: m.to, asked: m.text, pending: true });
        continue;
      }
      replies.push({ ...m, asked: asked.join(JOIN) });
      asked = [];
    }
    // an addressed question that a reply followed is no longer pending
    replies.forEach((r, i) => {
      if (!r.pending) return;
      r.pending = !replies.slice(i + 1).some(x => !x.pending && x.session === r.session);
    });
    if (!replies.length) return tlEl.replaceChildren(el('p', 'empty-note', 'no replies yet'));
    tlRows = replies;
    // never a mixed strip: default to the session of the NEWEST reply
    tlFilter = replies.length ? (replies[replies.length - 1].session || '') : null;
    try {
      tlNames = (await (await fetch('/api/sessions', { cache: 'no-store' })).json()).sessions || {};
    } catch { tlNames = {}; }
    drawTimeline();
    tlEl.scrollLeft = tlEl.scrollWidth;      // newest first to the eye, at the right edge
    fit();
  }

  /** Draw the strip, grouped by session, optionally showing only one of them.
      Claude Code does not name a session, so the label is what it opened with — the
      same string its own picker shows. */
  let menuList = null;                       // the floating panel, parked on <body>

  function closeSessionMenu() {
    if (menuList) menuList.classList.remove('open');
  }

  function sessionMenu() {
    const wrap = el('div', 'tl-menu');
    const cur = tlNames[tlFilter] || (tlFilter === '' ? 'before sessions were recorded' : '');
    const btn = el('button', '', 'session: ' + (cur ? cur.slice(0, 28) : '—') + ' ▾');
    btn.type = 'button';
    const list = el('div', 'tl-list');
    const ids = [...new Set(tlRows.map(m => m.session || ''))];
    // every session that HAS a transcript, newest first, plus any in the log without one
    Object.keys(tlNames).forEach(id => { if (!ids.includes(id)) ids.push(id); });
    const withReplies = new Set(tlRows.map(m => m.session || ''));
    ids.forEach(id => {
      const b = el('button', tlFilter === id ? 'on' : '');
      b.type = 'button';
      const n = tlRows.filter(m => (m.session || '') === id).length;
      b.append(el('em', '', id ? id.slice(0, 8) : '—'),
               el('span', '', (id ? (tlNames[id] || '(transcript gone)') : 'before sessions were recorded')),
               el('em', '', n ? n + ' here' : 'no control room log available'));
      b.classList.toggle('empty', !withReplies.has(id));
      b.onclick = () => {
        tlFilter = id;                       // exactly one session is shown, always
        // ...and what you write next goes THERE. Choosing a session to look at and
        // then talking to a different one is the confusing half of this panel.
        target = id || '';
        drawTarget();
        closeSessionMenu();
        drawTimeline();
      };
      list.append(b);
    });
    const openAt = () => {
      const r = btn.getBoundingClientRect();
      list.style.left = Math.round(r.left) + 'px';
      list.style.top = Math.round(r.bottom + 6) + 'px';
      list.classList.add('open');
    };
    // hover opens it; it closes when the pointer leaves BOTH the button and the list,
    // which are not nested (the list lives on <body> to escape the strip's clipping)
    let leaveTimer = null;
    const hold = () => { if (leaveTimer) { clearTimeout(leaveTimer); leaveTimer = null; } };
    const later = () => { hold(); leaveTimer = setTimeout(closeSessionMenu, 220); };
    btn.onmouseenter = () => { hold(); openAt(); };
    btn.onmouseleave = later;
    list.onmouseenter = hold;
    list.onmouseleave = later;
    btn.onclick = openAt;
    if (menuList) menuList.remove();
    menuList = list;
    document.body.append(list);              // out of the strip, so nothing clips it
    wrap.append(btn);
    return wrap;
  }

  function drawTimeline() {
    const nodes = [sessionMenu()];
    let seen = null, nth = 0, shown = 0;
    tlRows.forEach((m, i) => {
      // '' is "no session recorded" -- a real key, because null would be indistinguishable
      // from tlFilter === null, which means "no filter at all"
      const sid = m.session || '';
      const isNew = (i === 0 || sid !== seen);
      if (isNew) { nth++; seen = sid; }
      if (tlFilter !== null && sid !== tlFilter) return;
      if (isNew) {
        const n = nth;
        if (nodes.length) nodes.push(el('div', 'tl-rule'));
        const sep = el('div', 'tl-sep' + (tlFilter === sid ? ' on' : ''));
        sep.append(el('i', '', sid ? (tlNames[sid] || '(transcript gone)').slice(0, 60)
                                   : 'before sessions were recorded'),
                   el('span', '', sid ? sid.slice(0, 8) : '—'));
        sep.title = sid ? 'Claude session ' + sid : 'no session recorded';
        nodes.push(sep);
      }
      shown++;
      nodes.push(thumbOf(m, i + 1));
    });
    if (shown === 0) {
      const note = el('div', 'tl-empty');
      const id = tlFilter || '';
      note.append(
        el('b', '', 'No Control Room replies from this session'),
        el('span', '', id ? (tlNames[id] || '') : ''),
        el('code', '', id ? 'claude --resume ' + id : ''),
        el('i', '', id ? 'Run that in a terminal to continue it. Its watcher then picks up what you send here.'
                       : ''));
      nodes.push(note);
    }
    tlEl.replaceChildren(...nodes);
    if (shown) tlEl.scrollLeft = tlEl.scrollWidth;
  }

  function closeTimeline() {
    tlOpen = false;
    pinned = null;
    closeSessionMenu();
    restoreLive();
    tlEl.classList.remove('open');
    tlEl.replaceChildren();
    tlBtn.classList.remove('on');
    fit();
  }

  tlBtn.onclick = () => (tlOpen ? closeTimeline() : openTimeline());

  /* The pill is honest about its own limits: a page cannot make a Claude session read
     the log again. What it CAN do is rule out the two things that look identical from
     here — a stale page and a dead server — and say plainly what only you can fix. */
  deaf.onclick = () => {
    const age = lastWatchAge;
    const blocks = [
      { type: 'say', body: 'Nothing is reading the log. Your messages are being stored — they are not lost — but nobody will answer until a session picks them up.' },
      { type: 'note', body: age === null || age === undefined
          ? 'The watcher has never checked in since this server started.'
          : 'Last heartbeat: ' + age + ' seconds ago. Anything over 90 means the watch is gone.' },
      { type: 'note', body: 'The green lamp only means this page can reach the panel server. That is a different thing from a Claude session reading what you send.' },
      { type: 'say', body: 'What this button can rule out' },
      { type: 'pick', body: 'Reload the page => __reload' },
      { type: 'note', body: 'Use it if the page has been open a long time: a stale tab can report an old heartbeat.' },
      { type: 'say', body: 'What only you can fix' },
      { type: 'note', body: 'The watch lives inside a Claude Code session. If that session ended, say anything in the Claude panel in VS Code — the session re-arms the watch on its next turn and picks up everything waiting here.' },
      { type: 'note', body: 'If the panel itself is dead rather than unwatched, the lamp goes red and tells you the command to restart it.' },
    ];
    openSheet('Nobody is watching', blocks, null);
  };

  document.getElementById('wipe').onclick = () => {
    lastCommand = '';
    show([], false);      // nothing new arrives until the next reply, so it stays blank
    input.focus();
  };

  document.addEventListener('keydown', (e) => {
    if (e.key === 'Escape' && sheet) { e.preventDefault(); return closeSheet(); }
    if (e.key === 'Escape' && tlOpen) { e.preventDefault(); return closeTimeline(); }
    if (!/^[1-9]$/.test(e.key) || e.metaKey || e.ctrlKey || e.altKey) return;
    if (input.value.trim()) return;
    const surface = sheet || screenEl;
    const btn = surface.querySelectorAll('.picks button:not(.fill)')[Number(e.key) - 1];
    if (!btn) return;
    e.preventDefault();
    btn.click();
  });

  closeSheet();          // the right pane starts empty, with its prompt
  poll();
  setInterval(poll, 1000);
</script>
</body>
</html>
